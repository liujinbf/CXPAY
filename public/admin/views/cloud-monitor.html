<section data-feature="cloud-monitor" class="space-y-4">
<div class="glass-panel rounded-2xl p-6 flex items-center justify-between gap-4">
    <div>
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="cloud-cog" class="w-5 h-5 text-cyan-600"></i> 个人收款码云监控状态
        </h3>
        <p class="text-xs text-slate-400 mt-1">采集器超过 120 秒没有通过签名鉴权即显示离线；页面不会读取或显示任何密钥。</p>
    </div>
    <button data-action="refresh-cloud-monitor" class="px-3 py-2 border border-slate-200 rounded-xl text-xs font-bold">刷新状态</button>
</div>
<div id="cloud-monitor-warnings" class="hidden p-4 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-700"></div>
<div id="cloud-monitor-list" class="grid grid-cols-1 xl:grid-cols-2 gap-4">
    <div class="glass-panel rounded-2xl p-6 text-center text-xs text-slate-400">正在读取云监控状态...</div>
</div>
</section>
