<section data-feature="channels" class="space-y-6">
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
        <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
            <i data-lucide="settings-2" class="w-6 h-6 text-indigo-600"></i> 平台全局收款通道配置
        </h2>
        <p class="text-xs text-slate-400 mt-1">控制全平台底层支付驱动的启用状态、轮询分配权重与高级通信参数</p>
    </div>
    <div class="flex items-center gap-2">
        <button data-action="refresh-channels" class="px-4 py-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-xl text-xs font-bold shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-blue-500"></i> 刷新通道
        </button>
    </div>
</div>

<!-- 顶部核心通道状态统计条 -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    <div class="glass-panel p-4 rounded-2xl border border-slate-200/80 bg-white flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center flex-shrink-0 font-bold">
            <i data-lucide="layers" class="w-5 h-5"></i>
        </div>
        <div>
            <div class="text-[11px] font-semibold text-slate-400">已接入驱动总数</div>
            <div id="channel-stat-driver-count" class="text-base font-black text-slate-800 mt-0.5">加载中...</div>
        </div>
    </div>

    <div class="glass-panel p-4 rounded-2xl border border-slate-200/80 bg-white flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0 font-bold">
            <i data-lucide="check-circle" class="w-5 h-5"></i>
        </div>
        <div>
            <div class="text-[11px] font-semibold text-slate-400">全局激活在线通道</div>
            <div id="channel-stat-active-count" class="text-base font-black text-emerald-600 mt-0.5">加载中...</div>
        </div>
    </div>

    <div class="glass-panel p-4 rounded-2xl border border-slate-200/80 bg-white flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center flex-shrink-0 font-bold">
            <i data-lucide="sliders" class="w-5 h-5"></i>
        </div>
        <div>
            <div class="text-[11px] font-semibold text-slate-400">智能负载均衡算法</div>
            <div class="text-base font-black text-slate-800 mt-0.5">加权随机轮询 (Weighted)</div>
        </div>
    </div>
</div>

<!-- 通道配置操作提示 -->
<div class="p-4 rounded-2xl bg-indigo-50/60 border border-indigo-100/80 text-xs text-indigo-800 flex items-center justify-between">
    <div class="flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-indigo-600 flex-shrink-0"></i>
        <span>提示：停用某通道后，商户端将无法选择该通道发起交易；路由权重决定订单轮询命中的相对概率（如 100 vs 50）。</span>
    </div>
    <span class="hidden sm:inline-flex font-mono text-[11px] font-bold text-indigo-600 bg-white px-2.5 py-1 rounded-lg border border-indigo-200 shadow-2xs">动态感知已就绪</span>
</div>

<!-- 通道卡片网格列表 (3列卡片响应式平铺，精致高密度) -->
<div id="admin-channel-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
    <div class="p-8 text-center text-xs text-slate-400 col-span-full">正在加载平台全局通道...</div>
</div>
    <div id="channel-config-editor" class="hidden fixed inset-0 z-50 bg-slate-950/45 backdrop-blur-sm flex items-center justify-center p-4">
        <form data-role="channel-config-form" class="w-full max-w-lg bg-white rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <div>
                    <h3 id="channel-config-title" class="font-extrabold text-slate-800 text-base">配置支付通道参数</h3>
                    <p id="channel-config-subtitle" class="text-xs text-slate-400 font-mono mt-0.5"></p>
                </div>
                <button type="button" data-action="close-channel-editor" class="text-slate-400 hover:text-slate-700 text-xl font-bold">✕</button>
            </div>
            
            <input id="channel-config-id" type="hidden" value="0">
            <input id="channel-config-ctype" type="hidden" value="">

            <!-- 基础路由与权重配置 -->
            <div class="grid grid-cols-2 gap-3 text-xs">
                <label class="space-y-1">
                    <span class="font-bold text-slate-700">通道显示名称 *</span>
                    <input id="channel-config-name" required maxlength="100" class="w-full px-3 py-2 border rounded-xl">
                </label>
                <label class="space-y-1">
                    <span class="font-bold text-slate-700">轮询权重 (1-10000) *</span>
                    <input id="channel-config-weight" required type="number" min="1" max="10000" value="100" class="w-full px-3 py-2 border rounded-xl font-mono">
                </label>
            </div>

            <div class="grid grid-cols-2 gap-3 text-xs">
                <label class="space-y-1">
                    <span class="font-bold text-slate-700">单笔最小金额 (元)</span>
                    <input id="channel-config-min" type="number" step="0.01" value="0.00" class="w-full px-3 py-2 border rounded-xl font-mono">
                </label>
                <label class="space-y-1">
                    <span class="font-bold text-slate-700">单笔最大金额 (元)</span>
                    <input id="channel-config-max" type="number" step="0.01" value="0.00" class="w-full px-3 py-2 border rounded-xl font-mono">
                </label>
            </div>

            <!-- 动态驱动 inputs 参数容器 -->
            <div class="border-t border-slate-100 pt-3 space-y-3">
                <div class="text-xs font-bold text-slate-800 flex items-center justify-between">
                    <span>通信与密钥参数配置</span>
                    <span class="text-[10px] text-slate-400 font-normal">敏感密钥将采用 Authcode 算法安全加密</span>
                </div>
                <div id="channel-dynamic-inputs" class="space-y-3 text-xs">
                    <!-- 动态加载驱动表单项 -->
                    <div class="p-4 text-center text-slate-400 font-bold">正在读取驱动配置要求...</div>
                </div>
            </div>

            <!-- 备注说明 -->
            <label class="block space-y-1 text-xs border-t border-slate-100 pt-3">
                <span class="font-bold text-slate-700">通道备注说明</span>
                <input id="channel-config-remark" maxlength="255" placeholder="例如：备用网关 / 主用官方渠道" class="w-full px-3 py-2 border rounded-xl">
            </label>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" data-action="close-channel-editor" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50">取消</button>
                <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 shadow-md">保存并启用配置</button>
            </div>
        </form>
    </div>
</section>
