<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 云端控制面星空舱体渐变 -->
    <radialGradient id="cloudBg" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#241242" />
      <stop offset="60%" stop-color="#0e071e" />
      <stop offset="100%" stop-color="#05020c" />
    </radialGradient>

    <!-- 边框流光 -->
    <linearGradient id="cloudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>

    <!-- 极光紫渐变 (云端 C 环) -->
    <linearGradient id="cloudGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- 极速 X 光刃 1 (霓虹紫靛) -->
    <linearGradient id="cloudGradX1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- 极速 X 光刃 2 (深紫与电光青) -->
    <linearGradient id="cloudGradX2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- 官方授权金芒晶核渐变 -->
    <linearGradient id="licenseGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="cloudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle 舱体底座 -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#cloudBg)" stroke="url(#cloudBorder)" stroke-width="6" />

  <!-- 2. 云端核心图腾 -->
  <g filter="url(#cloudGlow)">
    <!-- 字母 C：云端主控环弧 -->
    <path d="M 270 120 
             L 205 120 
             C 145 120, 95 168, 95 230 
             L 95 282 
             C 95 344, 145 392, 205 392 
             L 270 392 
             L 270 332 
             L 210 332 
             C 180 332, 155 310, 155 280 
             L 155 232 
             C 155 202, 180 180, 210 180 
             L 270 180 
             Z" 
          fill="url(#cloudGradC)" />

    <!-- 字母 X 下降切刃 -->
    <path d="M 235 120 
             L 295 120 
             L 415 308 
             L 415 392 
             L 355 392 
             L 282 278 
             L 235 348 
             L 190 348 
             L 250 256 
             Z" 
          fill="url(#cloudGradX1)" />

    <!-- 字母 X 上升切刃 -->
    <path d="M 355 120 
             L 415 120 
             L 305 290 
             L 260 220 
             Z" 
          fill="url(#cloudGradX2)" />

    <!-- 云端官方授权加密金核 (象征 RSA-SHA256 签名与权威发证) -->
    <polygon points="268,210 290,210 258,285 282,285 240,345 252,268 234,268" 
             fill="url(#licenseGold)" />
  </g>
</svg>
