<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CXPAY 安装向导</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <style>
        body { background: #07111f; color: #e5edf7; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .panel { background: rgba(15, 29, 50, .94); border: 1px solid #203958; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
        .input { width: 100%; border: 1px solid #38536f; background: #0a192b; border-radius: .65rem; padding: .75rem; color: #fff; outline: none; }
        .input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, .15); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10">
<main id="app" class="mx-auto max-w-3xl">
    <section class="panel rounded-2xl overflow-hidden">
        <header class="border-b border-slate-700 p-6 md:p-8">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs font-bold tracking-[.2em] text-sky-400">CXPAY SETUP</p>
                    <h1 class="mt-2 text-2xl font-bold text-white">新手友好安装向导</h1>
                    <p class="mt-2 text-sm leading-6 text-slate-400">只需确认服务器环境、填写数据库和管理员信息。安装器会自动生成安全密钥、初始化数据表并锁定安装入口。</p>
                </div>
                <span class="rounded-full border border-sky-500/40 bg-sky-500/10 px-3 py-1 text-xs font-semibold text-sky-300">第 {{ step }} / 3 步</span>
            </div>
            <div class="mt-6 flex gap-2">
                <div v-for="number in 3" :key="number" class="h-1 flex-1 rounded" :class="number <= step ? 'bg-sky-400' : 'bg-slate-700'"></div>
            </div>
        </header>

        <div class="p-6 md:p-8">
            <template v-if="step === 1">
                <div class="flex items-center justify-between gap-3">
                    <div>
                        <h2 class="text-lg font-bold text-white">1. 自动检查服务器</h2>
                        <p class="mt-1 text-sm text-slate-400">必须全部通过才会允许安装，避免安装到一半失败。</p>
                    </div>
                    <button @click="checkEnvironment" :disabled="checking" class="rounded-lg border border-sky-500/50 px-3 py-2 text-sm text-sky-300 disabled:opacity-50">{{ checking ? '检测中…' : '重新检测' }}</button>
                </div>

                <div v-if="checkError" class="mt-5 rounded-xl border border-rose-500/40 bg-rose-500/10 p-4 text-sm text-rose-200">{{ checkError }}</div>
                <div v-else-if="checking" class="py-12 text-center text-slate-400">正在检测 PHP、扩展、依赖、目录权限与运行模式…</div>
                <template v-else>
                    <div class="mt-6 grid gap-3 md:grid-cols-2">
                        <div class="rounded-xl border p-4" :class="env.php_ok ? okClass : badClass">
                            <p class="font-semibold">PHP {{ env.php_version || '未检测到' }}</p>
                            <p class="mt-1 text-xs opacity-80">要求 PHP 8.1 或更高</p>
                        </div>
                        <div class="rounded-xl border p-4" :class="env.autoload_ready ? okClass : badClass">
                            <p class="font-semibold">Composer 依赖</p>
                            <p class="mt-1 text-xs opacity-80">{{ env.autoload_ready ? 'vendor 依赖已就绪' : '未检测到 vendor/autoload.php' }}</p>
                        </div>
                        <div class="rounded-xl border p-4" :class="env.all_perms_ok ? okClass : badClass">
                            <p class="font-semibold">文件写入权限</p>
                            <p class="mt-1 text-xs opacity-80">.env、runtime、runtime/logs、安装锁目录</p>
                        </div>
                        <div class="rounded-xl border p-4" :class="env.webman_process ? okClass : badClass">
                            <p class="font-semibold">Webman 常驻进程</p>
                            <p class="mt-1 text-xs opacity-80">{{ env.webman_process ? '当前由 Webman 处理请求' : '检测到 PHP-FPM；请改为 Nginx 反向代理' }}</p>
                        </div>
                    </div>

                    <div class="mt-4 rounded-xl border border-slate-700 bg-slate-950/40 p-4">
                        <p class="text-sm font-semibold text-white">PHP 扩展</p>
                        <div class="mt-3 flex flex-wrap gap-2">
                            <span v-for="(loaded, name) in env.extensions" :key="name" class="rounded-full px-2.5 py-1 text-xs" :class="loaded ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300'">{{ loaded ? '✓' : '×' }} {{ name }}</span>
                        </div>
                    </div>

                    <div v-if="env.installed" class="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 p-4 text-sm text-amber-100">
                        此站点已有安装锁。网页安装器只允许用于全新空库；升级旧站请使用部署文档中的数据库补丁流程。
                    </div>
                    <div v-if="env.fix_hints && env.fix_hints.length" class="mt-4 rounded-xl border border-amber-500/40 bg-amber-500/10 p-4 text-sm text-amber-100">
                        <p class="font-semibold">需要处理后再继续：</p>
                        <ul class="mt-2 list-disc space-y-1 pl-5"><li v-for="hint in env.fix_hints" :key="hint">{{ hint }}</li></ul>
                    </div>

                    <button @click="step = 2" :disabled="!env.can_install" class="mt-6 w-full rounded-xl bg-sky-500 px-5 py-3.5 font-bold text-white transition hover:bg-sky-400 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-400">环境通过，继续配置数据库</button>
                </template>
            </template>

            <template v-else-if="step === 2">
                <div>
                    <h2 class="text-lg font-bold text-white">2. 填写站点与数据库信息</h2>
                    <p class="mt-1 text-sm text-slate-400">数据库必须是专用的空数据库。安装器会先检测，发现已有表会立即停止，绝不覆盖数据。</p>
                </div>

                <div class="mt-6 space-y-5">
                    <label class="block text-sm font-semibold text-slate-200">站点公开访问地址
                        <input v-model.trim="form.app_url" class="input mt-2" placeholder="https://pay.example.com">
                        <span class="mt-1 block text-xs font-normal text-slate-500">用于生成支付通知地址；请填写最终已绑定 HTTPS 的域名。</span>
                    </label>
                    <div class="grid gap-4 md:grid-cols-2">
                        <label class="block text-sm font-semibold text-slate-200">数据库主机<input v-model.trim="form.db_host" @input="invalidateDbTest" class="input mt-2" placeholder="127.0.0.1"></label>
                        <label class="block text-sm font-semibold text-slate-200">数据库端口<input v-model.trim="form.db_port" @input="invalidateDbTest" class="input mt-2" placeholder="3306"></label>
                    </div>
                    <label class="block text-sm font-semibold text-slate-200">数据库名称<input v-model.trim="form.db_name" @input="invalidateDbTest" class="input mt-2" placeholder="cxpay"></label>
                    <div class="grid gap-4 md:grid-cols-2">
                        <label class="block text-sm font-semibold text-slate-200">数据库用户名<input v-model.trim="form.db_user" @input="invalidateDbTest" class="input mt-2" placeholder="cxpay_user"></label>
                        <label class="block text-sm font-semibold text-slate-200">数据库密码<input v-model="form.db_pass" @input="invalidateDbTest" type="password" class="input mt-2" autocomplete="new-password"></label>
                    </div>

                    <button @click="testDatabase" :disabled="testingDb" class="w-full rounded-xl border border-sky-500/50 bg-sky-500/10 px-5 py-3 font-semibold text-sky-200 disabled:opacity-50">{{ testingDb ? '正在检测数据库…' : '先检测数据库连接和空库状态' }}</button>
                    <div v-if="dbMessage" class="rounded-xl border p-4 text-sm" :class="dbTestOk ? okClass : badClass">{{ dbMessage }}</div>

                    <div class="border-t border-slate-700 pt-5">
                        <p class="text-sm font-bold text-white">设置管理员账号</p>
                        <p class="mt-1 text-xs text-slate-500">密码不会回显或保存到浏览器。请使用至少 12 位、含三类字符的强密码。</p>
                        <div class="mt-3 grid gap-4 md:grid-cols-2">
                            <label class="block text-sm font-semibold text-slate-200">管理员用户名<input v-model.trim="form.admin_user" class="input mt-2" autocomplete="username"></label>
                            <label class="block text-sm font-semibold text-slate-200">管理员密码<input v-model="form.admin_pass" type="password" class="input mt-2" autocomplete="new-password"></label>
                        </div>
                    </div>

                    <label class="flex cursor-pointer items-start gap-3 rounded-xl border border-amber-500/40 bg-amber-500/10 p-4 text-sm text-amber-100">
                        <input v-model="confirmFresh" type="checkbox" class="mt-1 h-4 w-4">
                        <span>我确认这是一个新站点，所选数据库为专用空库；我了解安装完成后将生成安装锁，不能用于覆盖旧系统。</span>
                    </label>
                </div>

                <div class="mt-7 flex gap-3">
                    <button @click="step = 1" class="w-1/3 rounded-xl border border-slate-600 px-4 py-3 font-semibold text-slate-200">返回</button>
                    <button @click="installSystem" :disabled="installing || !dbTestOk || !confirmFresh" class="w-2/3 rounded-xl bg-emerald-500 px-4 py-3 font-bold text-white hover:bg-emerald-400 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-400">{{ installing ? '正在安全初始化，请勿关闭页面…' : '确认并开始安装' }}</button>
                </div>
            </template>

            <template v-else>
                <div class="text-center">
                    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-500/15 text-3xl text-emerald-300">✓</div>
                    <h2 class="mt-5 text-2xl font-bold text-white">安装完成</h2>
                    <p class="mt-2 text-sm leading-6 text-slate-400">安全密钥、管理员密码哈希、数据库表与安装锁均已创建。最后重启服务即可加载新配置。</p>
                </div>
                <div class="mt-6 space-y-3 rounded-xl border border-slate-700 bg-slate-950/40 p-5 text-sm">
                    <p><span class="text-slate-400">1. 在服务器终端执行：</span><code class="ml-2 rounded bg-slate-800 px-2 py-1 text-sky-300">systemctl restart cxpay-webman</code></p>
                    <p><span class="text-slate-400">2. 确认服务状态：</span><code class="ml-2 rounded bg-slate-800 px-2 py-1 text-sky-300">systemctl status cxpay-webman</code></p>
                    <p><span class="text-slate-400">3. 登录后台：</span><a :href="result.admin_url" class="ml-2 break-all text-sky-300 underline">{{ result.admin_url }}</a></p>
                </div>
                <p class="mt-5 text-center text-xs leading-5 text-amber-200">请妥善保存管理员密码；不要删除 install.lock，不要开放 8787 端口到公网。</p>
            </template>
        </div>
    </section>
</main>

<script>
const { createApp, ref } = Vue;
createApp({
    setup() {
        const step = ref(1), checking = ref(true), checkError = ref(''), testingDb = ref(false), installing = ref(false);
        const dbTestOk = ref(false), dbMessage = ref(''), confirmFresh = ref(false);
        const okClass = 'border-emerald-500/40 bg-emerald-500/10 text-emerald-200';
        const badClass = 'border-rose-500/40 bg-rose-500/10 text-rose-200';
        const env = ref({ extensions: {}, permissions: {}, fix_hints: [], can_install: false });
        const form = ref({ app_url: window.location.origin, db_host: '127.0.0.1', db_port: '3306', db_name: 'cxpay', db_user: 'root', db_pass: '', admin_user: 'admin', admin_pass: '' });
        const result = ref({ admin_url: window.location.origin + '/admin_login.html' });

        async function request(url, body) {
            const response = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) } : undefined);
            const text = await response.text();
            try { return JSON.parse(text); } catch (_) { throw new Error('服务器返回异常，请查看 Webman 运行日志。'); }
        }
        async function checkEnvironment() {
            checking.value = true; checkError.value = '';
            try { const data = await request('/api/install/check'); if (data.code !== 1) throw new Error(data.msg || '环境检测失败'); env.value = data.data; }
            catch (error) { env.value = { extensions: {}, permissions: {}, fix_hints: [], can_install: false }; checkError.value = error.message; }
            finally { checking.value = false; }
        }
        function invalidateDbTest() { dbTestOk.value = false; dbMessage.value = ''; }
        async function testDatabase() {
            testingDb.value = true; dbTestOk.value = false; dbMessage.value = '';
            try { const data = await request('/api/install/test_db', form.value); dbTestOk.value = data.code === 1; dbMessage.value = data.msg || (dbTestOk.value ? '检测通过' : '检测失败'); }
            catch (error) { dbMessage.value = error.message; }
            finally { testingDb.value = false; }
        }
        async function installSystem() {
            installing.value = true;
            try {
                const data = await request('/api/install/execute', form.value);
                if (data.code !== 1) throw new Error(data.msg || '安装失败');
                result.value = data.data || result.value; step.value = 3;
            } catch (error) { alert('安装未完成：' + error.message); }
            finally { installing.value = false; }
        }
        checkEnvironment();
        return { step, checking, checkError, testingDb, installing, dbTestOk, dbMessage, confirmFresh, env, form, result, okClass, badClass, checkEnvironment, invalidateDbTest, testDatabase, installSystem };
    }
}).mount('#app');
</script>
</body>
</html>
