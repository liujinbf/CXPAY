<section data-feature="profile" class="space-y-6">
    <h2 class="text-xl font-extrabold text-slate-800">账户设置与资料管理</h2>
    <div class="glass-card rounded-2xl p-6 space-y-4 max-w-2xl">
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">商户名称</label>
            <input id="profile-merchant-name" type="text" value="" class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold bg-slate-50" readonly>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">商户对接 PID</label>
            <input id="profile-merchant-pid" type="text" value="" class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs font-mono font-bold bg-slate-50" readonly>
        </div>
        <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">修改登录密码</label>
            <input id="profile-current-password" type="password" placeholder="当前登录密码" class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs mb-2">
            <input id="profile-new-password" type="password" placeholder="新密码（至少10个字符）" class="w-full px-4 py-2 border border-slate-200 rounded-xl text-xs">
        </div>
        <button data-action="change-password" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-blue-700 transition-colors">修改登录密码</button>
    </div>
</section>
