<section data-feature="finance" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <i data-lucide="wallet-cards" class="w-6 h-6 text-emerald-600"></i> 财务管理 · 服务费明细与交易流水
            </h2>
            <p class="text-xs text-slate-400 mt-1">展示商户服务费充值、通道手续费抵扣与返还、套餐订购等完整资金对账流水</p>
        </div>
        <div class="flex items-center gap-2.5">
            <button data-action="refresh-finance" class="px-3.5 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer shadow-2xs">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 刷新明细
            </button>
            <button data-action="contact-finance" class="px-4 py-2 bg-emerald-600 text-white hover:bg-emerald-700 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-1.5 cursor-pointer">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 服务费余额充值
            </button>
        </div>
    </div>

    <div class="glass-card rounded-2xl p-6 space-y-4">
        <div class="overflow-x-auto">
            <table class="w-full text-xs text-left">
                <thead class="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                    <tr>
                        <th class="p-3">变动时间</th>
                        <th class="p-3">流水号 / 关联单号</th>
                        <th class="p-3 text-center">业务类型</th>
                        <th class="p-3">变动金额</th>
                        <th class="p-3">变动前余额</th>
                        <th class="p-3">变动后余额</th>
                        <th class="p-3">说明备注</th>
                    </tr>
                </thead>
                <tbody id="finance-log-tbody" class="divide-y divide-slate-100">
                    <tr><td colspan="7" class="p-6 text-center text-slate-400 font-bold">正在加载财务明细...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
