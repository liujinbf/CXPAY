<section data-feature="alerts" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-extrabold text-slate-800 flex items-center gap-2">
                <i data-lucide="bell" class="w-6 h-6 text-rose-500"></i> 商户通知中心与预警偏好
            </h2>
            <p class="text-xs text-slate-400 mt-1">配置多种提醒渠道，实时掌握控制台登录、订单到账、通道掉线及服务费余额预警</p>
        </div>
        <button data-action="save-alerts" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="save" class="w-4 h-4"></i> 保存通知设置
        </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 text-xs">
        <!-- 左侧 2/3 列：通知总开关、订阅事件矩阵与余额阈值 -->
        <div class="lg:col-span-2 space-y-6">
            <!-- 通知总开关与事件订阅矩阵 -->
            <div class="glass-card rounded-2xl p-6 border-t-4 border-t-rose-500 shadow-sm space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                        <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                            <i data-lucide="bell-ring" class="w-4 h-4 text-rose-500"></i> 核心通知总控与事件订阅
                        </h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">主开关开启后，订阅的事件将触发推送通知</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="m-alert-enabled" class="sr-only peer">
                        <div class="w-10 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-600"></div>
                    </label>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 登录提醒 -->
                    <label class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3 cursor-pointer hover:border-slate-300 transition-colors">
                        <input type="checkbox" id="m-event-merchant_login" class="mt-0.5 rounded text-rose-600 focus:ring-rose-500">
                        <div>
                            <div class="font-bold text-slate-800 flex items-center gap-1.5">
                                <i data-lucide="shield-alert" class="w-3.5 h-3.5 text-indigo-500"></i> 控制台登录提醒
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">当您的账户成功登录控制台时推送提醒</div>
                        </div>
                    </label>

                    <!-- 账单到账提醒 -->
                    <label class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3 cursor-pointer hover:border-slate-300 transition-colors">
                        <input type="checkbox" id="m-event-order_paid" class="mt-0.5 rounded text-rose-600 focus:ring-rose-500">
                        <div>
                            <div class="font-bold text-slate-800 flex items-center gap-1.5">
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-500"></i> 账单成功到账提醒
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">客户支付成功并完成自动核销时推送到账信息</div>
                        </div>
                    </label>

                    <!-- 通道掉线提醒 -->
                    <label class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3 cursor-pointer hover:border-slate-300 transition-colors">
                        <input type="checkbox" id="m-event-channel_offline" class="mt-0.5 rounded text-rose-600 focus:ring-rose-500">
                        <div>
                            <div class="font-bold text-slate-800 flex items-center gap-1.5">
                                <i data-lucide="wifi-off" class="w-3.5 h-3.5 text-amber-500"></i> 收款通道掉线提醒
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">收款账号超时未上报心跳时提示检查App/协议</div>
                        </div>
                    </label>

                    <!-- 服务费余额不足提醒 -->
                    <label class="p-3.5 bg-slate-50 rounded-xl border border-slate-100 flex items-start gap-3 cursor-pointer hover:border-slate-300 transition-colors">
                        <input type="checkbox" id="m-event-low_balance" class="mt-0.5 rounded text-rose-600 focus:ring-rose-500">
                        <div>
                            <div class="font-bold text-slate-800 flex items-center gap-1.5">
                                <i data-lucide="coins" class="w-3.5 h-3.5 text-rose-500"></i> 服务费低余额预警
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">账户服务费余额低于设定的触发线时预警</div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- 专属专维：CXPAY 核心服务费低余额预警阈值设置 -->
            <div class="glass-card rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                        <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                            <i data-lucide="piggy-bank" class="w-4 h-4 text-amber-500"></i> 服务费余额低额预警阈值
                        </h3>
                        <p class="text-[11px] text-slate-400 mt-0.5">平台根据设置的扣率扣除服务费，低于设定金额时自动提醒充值</p>
                    </div>
                    <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">保障不间断收款</span>
                </div>

                <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3">
                    <label class="block text-xs font-bold text-slate-700">当账户服务费余额低于 (元)：</label>
                    <div class="flex items-center gap-2">
                        <div class="relative flex-1 max-w-xs">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold font-mono">¥</span>
                            <input id="m-low-balance-threshold" type="number" step="1" min="0" placeholder="10.00" class="w-full pl-7 pr-3 py-2 border border-slate-200 rounded-xl font-mono font-bold text-slate-800 bg-white text-xs">
                        </div>
                        <span class="text-xs text-slate-500">元时，自动向已启用的渠道发送预警</span>
                    </div>
                    <p class="text-[11px] text-slate-400">建议设为 10~50 元，避免因服务费余额不足导致无法进行浮动计费或实时核销。</p>
                </div>
            </div>
        </div>

        <!-- 右侧 1/3 列：接收渠道配置 -->
        <div class="space-y-6">
            <div class="glass-card rounded-2xl p-6 border border-slate-200/80 shadow-sm space-y-4">
                <div class="border-b border-slate-100 pb-3">
                    <h3 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
                        <i data-lucide="send" class="w-4 h-4 text-blue-500"></i> 推送渠道绑定与调试
                    </h3>
                    <p class="text-[11px] text-slate-400 mt-0.5">请至少启用并配置一种消息接收方式</p>
                </div>

                <div class="space-y-4">
                    <!-- 1. 邮件 -->
                    <div class="p-3.5 bg-slate-50 rounded-xl space-y-2.5 border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700 flex items-center gap-1.5"><i data-lucide="mail" class="w-4 h-4 text-blue-500"></i> 电子邮箱通知</span>
                            <input type="checkbox" id="m-email-enabled" class="rounded text-blue-600">
                        </div>
                        <input type="text" id="m-email-to" placeholder="填入接收邮箱，多个逗号隔开 (如 my@qq.com)" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs bg-white">
                        <div class="flex justify-end">
                            <button data-action="test-alert" data-channel="email" class="px-3 py-1 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg font-bold text-[11px] transition-colors">测试邮件</button>
                        </div>
                    </div>

                    <!-- 2. 企业微信 Webhook -->
                    <div class="p-3.5 bg-slate-50 rounded-xl space-y-2.5 border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700 flex items-center gap-1.5"><i data-lucide="message-square" class="w-4 h-4 text-emerald-500"></i> 企微群机器人</span>
                            <input type="checkbox" id="m-wxwork-enabled" class="rounded text-emerald-600">
                        </div>
                        <input type="text" id="m-wxwork-url" placeholder="https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-mono bg-white">
                        <div class="flex justify-end">
                            <button data-action="test-alert" data-channel="wxwork" class="px-3 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-lg font-bold text-[11px] transition-colors">测试企微</button>
                        </div>
                    </div>

                    <!-- 3. Bark / 自定义 Webhook -->
                    <div class="p-3.5 bg-slate-50 rounded-xl space-y-2.5 border border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700 flex items-center gap-1.5"><i data-lucide="webhook" class="w-4 h-4 text-purple-500"></i> Bark / 自定义 Webhook</span>
                            <input type="checkbox" id="m-webhook-enabled" class="rounded text-purple-600">
                        </div>
                        <input type="text" id="m-webhook-url" placeholder="https://api.day.app/your_bark_key" class="w-full px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-mono bg-white">
                        <div class="flex justify-end">
                            <button data-action="test-alert" data-channel="webhook" class="px-3 py-1 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-lg font-bold text-[11px] transition-colors">测试 Webhook</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
