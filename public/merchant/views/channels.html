<section data-feature="channels" class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-extrabold text-slate-800">我的收款通道</h2>
            <p class="text-xs text-slate-400 mt-1">收款资金直接进入您的个人账号，请保持挂机监控或扫码协议在线</p>
        </div>
        <button data-action="open-channel-editor" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-blue-700 transition-colors flex items-center gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i> 添加通道
        </button>
    </div>

    <!-- 动态通道卡片列表容器 -->
    <div id="channel-card-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 动态渲染数据 -->
    </div>

<div id="add-channel-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[88vh] flex flex-col p-6 overflow-hidden">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 flex-shrink-0">
            <h3 id="modal-title" class="font-extrabold text-slate-800 text-base">添加收款通道</h3>
            <button data-action="close-channel-editor" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <input type="hidden" id="channel-id-input" value="0">

        <div class="space-y-4 text-xs overflow-y-auto my-3 pr-1.5 flex-1 custom-scrollbar">
            <div>
                <label class="block font-bold text-slate-700 mb-1"><span class="text-rose-500">*</span> 支付分类</label>
                <select id="channel-c-type" data-action="change-category" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-bold">
                    <option value="wxpay">微信</option>
                    <option value="alipay">支付宝</option>
                    <option value="qqpay">QQ</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1"><span class="text-rose-500">*</span> 通道类型 (由已开通套餐权限决定)</label>
                <select id="channel-driver-list" data-action="change-driver" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-bold">
                    <!-- 动态填充 -->
                </select>
                <div id="driver-config-fields" class="mt-3 space-y-3"></div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">自定义显示名称</label>
                <input id="channel-title-input" type="text" placeholder="留空则自动跟随通道类型名称" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-bold">
            </div>

            <!-- 📷 上传个人收款码与解码 URL -->
            <div id="static-qr-upload-box" class="p-3.5 bg-emerald-50/70 border border-emerald-200 rounded-2xl space-y-2.5">
                <div class="flex items-center justify-between">
                    <label class="font-extrabold text-slate-800 text-xs flex items-center gap-1">
                        <span>📷 收款码图片 / 解析 URL</span>
                        <span id="qr-required-span" class="text-emerald-600 font-bold">(选填/免强制)</span>
                    </label>
                    <input type="file" id="channel-qr-file" accept="image/*" data-action="upload-qr" class="hidden">
                    <button type="button" data-action="choose-qr-image" class="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-[11px] font-extrabold shadow-sm hover:bg-blue-700 flex items-center gap-1">
                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> 上传收款码图片自动识别
                    </button>
                </div>
                <div id="qr-upload-status" class="text-[11px] text-emerald-900 font-medium leading-relaxed">
                    图片仅在浏览器本地解析，识别结果会写入上方驱动配置，图片不会上传服务器。
                </div>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">备注说明 / 绑定设备号</label>
                <input id="channel-remark-input" type="text" placeholder="例如: 微信个人码 #15697116375 或 APP设备ID" class="w-full px-3 py-2 border border-slate-200 rounded-xl">
            </div>

            <div class="flex items-center justify-between pt-1">
                <span class="font-bold text-slate-700">通道启用状态</span>
                <input id="channel-status-input" type="checkbox" checked class="w-4 h-4 accent-blue-600 cursor-pointer">
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-100 flex-shrink-0 mt-auto">
            <button type="button" data-action="close-channel-editor" class="px-4 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50">取消</button>
            <button data-action="save-channel" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-blue-700">保存到数据库</button>
        </div>
    </div>
</div>

</section>
