<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 高端深邃背景渐变 -->
    <radialGradient id="cxBg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#0c172c" />
      <stop offset="60%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- 顶层外壳发光边框 -->
    <linearGradient id="cxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>

    <!-- 主动量：电光青蓝渐变 (C 环聚合流) -->
    <linearGradient id="cxGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 极速高能：X 翼前锋极光流 (穿透光刃) -->
    <linearGradient id="cxGradX1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 动力折射：X 翼次锋与深邃靛紫 -->
    <linearGradient id="cxGradX2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- 闪电脉冲晶核高光 -->
    <linearGradient id="cxPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 辉光滤镜 (确保高分屏与视网膜显示晶莹质感) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 圆角 Squircle 舱体底座 (在任何深色/浅色标签页背景上均保持完美立体反差) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#cxBg)" stroke="url(#cxBorder)" stroke-width="6" />

  <!-- 2. 内部微发光氛围光晕 -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <!-- 3. CXPAY 核心拓扑图腾 (C 与 X 浑然一体的极速几何) -->
  <g filter="url(#glow)">
    <!-- 字母 C：左侧聚合能量环弧 (Convergence Arc) -->
    <path d="M 270 120 
             L 205 120 
             C 145 120, 95 168, 95 230 
             L 95 282 
             C 95 344, 145 392, 205 392 
             L 270 392 
             L 270 332 
             L 210 332 
             C 180 332, 155 310, 155 280 
             L 155 232 
             C 155 202, 180 180, 210 180 
             L 270 180 
             Z" 
          fill="url(#cxGradC)" />

    <!-- 字母 X 下降切刃 (由左上经核心贯穿至右下，内置闪电倾角动力学) -->
    <path d="M 235 120 
             L 295 120 
             L 415 308 
             L 415 392 
             L 355 392 
             L 282 278 
             L 235 348 
             L 190 348 
             L 250 256 
             Z" 
          fill="url(#cxGradX1)" />

    <!-- 字母 X 上升切刃 (从右上方锐利向下切入，与 C 环及光刃自然咬合) -->
    <path d="M 355 120 
             L 415 120 
             L 305 290 
             L 260 220 
             Z" 
          fill="url(#cxGradX2)" />

    <!-- 核心疾速脉冲棱镜 (超星光芒点缀，象征毫秒级支付出码) -->
    <polygon points="268,220 286,220 258,290 280,290 244,342 254,272 238,272" 
             fill="url(#cxPulse)" />
  </g>
</svg>
