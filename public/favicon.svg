<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景流光渐变 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="70%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#03060a" />
    </radialGradient>

    <!-- CXPAY 主站专属科技蓝渐变 -->
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 闪电与极速能量渐变 -->
    <linearGradient id="lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- 发光投影滤镜 -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 浅发光边框 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- 图标圆角容器背景 (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 外部装饰性科技圆环与节点 -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="16 8 4 8" />
  <circle cx="256" cy="61" r="5" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="256" cy="451" r="5" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="61" cy="256" r="5" fill="#38bdf8" filter="url(#glowEffect)" />
  <circle cx="451" cy="256" r="5" fill="#38bdf8" filter="url(#glowEffect)" />

  <!-- 核心几何图形：字母 C 与 聚合闭环 -->
  <g filter="url(#glowEffect)">
    <!-- 字母 C：由聚合支付数据流环绕构成 -->
    <path d="M 230 155 
             L 165 155 
             A 60 60 0 0 0 105 215 
             L 105 297 
             A 60 60 0 0 0 165 357 
             L 230 357 
             L 230 317 
             L 170 317 
             A 20 20 0 0 1 150 297 
             L 150 215 
             A 20 20 0 0 1 170 195 
             L 230 195 
             Z" 
          fill="url(#cyberBlue)" />

    <!-- 聚合与极速闪电 (连接 C 与 X 的中枢，象征高并发毫秒级出码与核销) -->
    <polygon points="265,115 215,250 260,250 235,395 315,235 270,235" 
             fill="url(#lightningGlow)" />

    <!-- 字母 X 的右半部支撑架构 (象征坚若磐石的风控与幂等防重) -->
    <path d="M 330 155 
             L 375 155 
             L 320 256 
             L 385 357 
             L 340 357 
             L 295 285 
             L 315 250 
             Z" 
          fill="url(#cyberBlue)" />
          
    <path d="M 320 155 
             L 365 155 
             L 385 190 
             L 345 190 
             Z" 
          fill="#38bdf8" />
  </g>
</svg>
