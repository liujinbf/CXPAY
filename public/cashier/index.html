<!DOCTYPE html>

                        <i data-lucide="clock" class="w-3 h-3"></i> <span id="timer">03:00</span>

    <!-- 内置轻量自包含 QRCode 纯 JS 引擎（零外部 CDN 依赖，100% 离线立即可用） -->
    <script>
        /**
         * QRCode Generator for JavaScript
         * Fully self-contained, no external script dependencies.
         */
        var QRCodeLib = (function() {
            function QRCodeModel(typeNumber, errorCorrectLevel) {
                this.typeNumber = typeNumber;
                this.errorCorrectLevel = errorCorrectLevel;
                this.modules = null;
                this.moduleCount = 0;
                this.dataCache = null;
                this.dataList = [];
            }
            QRCodeModel.prototype = {
                addData: function(data) {
                    var newData = new QR8bitByte(data);
                    this.dataList.push(newData);
                    this.dataCache = null;
                },
                isDark: function(row, col) {
                    if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
                        throw new Error(row + "," + col);
                    }
                    return this.modules[row][col];
                },
                getModuleCount: function() {
                    return this.moduleCount;
                },
                make: function() {
                    if (this.typeNumber < 1) {
                        var typeNumber = 1;
                        for (typeNumber = 1; typeNumber < 40; typeNumber++) {
                            var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);
                            var buffer = new QRBitBuffer();
                            var totalDataCount = 0;
                            for (var i = 0; i < rsBlocks.length; i++) {
                                totalDataCount += rsBlocks[i].dataCount;
                            }
                            for (var i = 0; i < this.dataList.length; i++) {
                                var data = this.dataList[i];
                                buffer.put(data.mode, 4);
                                buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                                data.write(buffer);
                            }
                            if (buffer.getLengthInBits() <= totalDataCount * 8) break;
                        }
                        this.typeNumber = typeNumber;
                    }
                    this.makeImpl(false, this.getBestMaskPattern());
                },
                makeImpl: function(test, maskPattern) {
                    this.moduleCount = this.typeNumber * 4 + 17;
                    this.modules = new Array(this.moduleCount);
                    for (var row = 0; row < this.moduleCount; row++) {
                        this.modules[row] = new Array(this.moduleCount);
                        for (var col = 0; col < this.moduleCount; col++) {
                            this.modules[row][col] = null;
                        }
                    }
                    this.setupPositionProbePattern(0, 0);
                    this.setupPositionProbePattern(this.moduleCount - 7, 0);
                    this.setupPositionProbePattern(0, this.moduleCount - 7);
                    this.setupPositionAdjustPattern();
                    this.setupTimingPattern();
                    this.setupTypeInfo(test, maskPattern);
                    if (this.typeNumber >= 7) {
                        this.setupTypeNumber(test);
                    }
                    if (this.dataCache == null) {
                        this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
                    }
                    this.mapData(this.dataCache, maskPattern);
                },
                setupPositionProbePattern: function(row, col) {
                    for (var r = -1; r <= 7; r++) {
                        if (row + r <= -1 || this.moduleCount <= row + r) continue;
                        for (var c = -1; c <= 7; c++) {
                            if (col + c <= -1 || this.moduleCount <= col + c) continue;
                            if ((0 <= r && r <= 6 && (c == 0 || c == 6)) || (0 <= c && c <= 6 && (r == 0 || r == 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
                                this.modules[row + r][col + c] = true;
                            } else {
                                this.modules[row + r][col + c] = false;
                            }
                        }
                    }
                },
                getBestMaskPattern: function() {
                    var minLostPoint = 0;
                    var pattern = 0;
                    for (var i = 0; i < 8; i++) {
                        this.makeImpl(true, i);
                        var lostPoint = QRUtil.getLostPoint(this);
                        if (i == 0 || minLostPoint > lostPoint) {
                            minLostPoint = lostPoint;
                            pattern = i;
                        }
                    }
                    return pattern;
                },
                setupTimingPattern: function() {
                    for (var r = 8; r < this.moduleCount - 8; r++) {
                        if (this.modules[r][6] !== null) continue;
                        this.modules[r][6] = (r % 2 == 0);
                    }
                    for (var c = 8; c < this.moduleCount - 8; c++) {
                        if (this.modules[6][c] !== null) continue;
                        this.modules[6][c] = (c % 2 == 0);
                    }
                },
                setupPositionAdjustPattern: function() {
                    var pos = QRUtil.getPatternPosition(this.typeNumber);
                    for (var i = 0; i < pos.length; i++) {
                        for (var j = 0; j < pos.length; j++) {
                            var row = pos[i];
                            var col = pos[j];
                            if (this.modules[row][col] !== null) continue;
                            for (var r = -2; r <= 2; r++) {
                                for (var c = -2; c <= 2; c++) {
                                    if (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0)) {
                                        this.modules[row + r][col + c] = true;
                                    } else {
                                        this.modules[row + r][col + c] = false;
                                    }
                                }
                            }
                        }
                    }
                },
                setupTypeNumber: function(test) {
                    var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
                    for (var i = 0; i < 18; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
                        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
                    }
                },
                setupTypeInfo: function(test, maskPattern) {
                    var data = (this.errorCorrectLevel << 3) | maskPattern;
                    var bits = QRUtil.getBCHTypeInfo(data);
                    for (var i = 0; i < 15; i++) {
                        var mod = (!test && ((bits >> i) & 1) == 1);
                        if (i < 6) {
                            this.modules[i][8] = mod;
                        } else if (i < 8) {
                            this.modules[i + 1][8] = mod;
                        } else {
                            this.modules[this.moduleCount - 15 + i][8] = mod;
                        }
                        if (i < 8) {
                            this.modules[8][this.moduleCount - i - 1] = mod;
                        } else if (i < 9) {
                            this.modules[8][15 - i - 1 + 1] = mod;
                        } else {
                            this.modules[8][15 - i - 1] = mod;
                        }
                    }
                    this.modules[this.moduleCount - 8][8] = (!test);
                },
                mapData: function(data, maskPattern) {
                    var inc = -1;
                    var row = this.moduleCount - 1;
                    var bitIndex = 7;
                    var byteIndex = 0;
                    var maskFunc = QRUtil.getMaskFunction(maskPattern);
                    for (var col = this.moduleCount - 1; col > 0; col -= 2) {
                        if (col == 6) col--;
                        while (true) {
                            for (var c = 0; c < 2; c++) {
                                if (this.modules[row][col - c] === null) {
                                    var dark = false;
                                    if (byteIndex < data.length) {
                                        dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                                    }
                                    var mask = maskFunc(row, col - c);
                                    if (mask) dark = !dark;
                                    this.modules[row][col - c] = dark;
                                    bitIndex--;
                                    if (bitIndex == -1) {
                                        byteIndex++;
                                        bitIndex = 7;
                                    }
                                }
                            }
                            row += inc;
                            if (row < 0 || this.moduleCount <= row) {
                                row -= inc;
                                inc = -inc;
                                break;
                            }
                        }
                    }
                }
            };
            QRCodeModel.createData = function(typeNumber, errorCorrectLevel, dataList) {
                var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
                var buffer = new QRBitBuffer();
                for (var i = 0; i < dataList.length; i++) {
                    var data = dataList[i];
                    buffer.put(data.mode, 4);
                    buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
                    data.write(buffer);
                }
                var totalDataCount = 0;
                for (var i = 0; i < rsBlocks.length; i++) {
                    totalDataCount += rsBlocks[i].dataCount;
                }
                if (buffer.getLengthInBits() > totalDataCount * 8) {
                    throw new Error("code length overflow. (" + buffer.getLengthInBits() + ">" + totalDataCount * 8 + ")");
                }
                if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
                    buffer.put(0, 4);
                }
                while (buffer.getLengthInBits() % 8 != 0) {
                    buffer.putBit(false);
                }
                while (true) {
                    if (buffer.getLengthInBits() >= totalDataCount * 8) break;
                    buffer.put(0xEC, 8);
                    if (buffer.getLengthInBits() >= totalDataCount * 8) break;
                    buffer.put(0x11, 8);
                }
                return QRCodeModel.createBytes(buffer, rsBlocks);
            };
            QRCodeModel.createBytes = function(buffer, rsBlocks) {
                var offset = 0;
                var maxDcCount = 0;
                var maxEcCount = 0;
                var dcdata = new Array(rsBlocks.length);
                var ecdata = new Array(rsBlocks.length);
                for (var r = 0; r < rsBlocks.length; r++) {
                    var dcCount = rsBlocks[r].dataCount;
                    var ecCount = rsBlocks[r].totalCount - dcCount;
                    maxDcCount = Math.max(maxDcCount, dcCount);
                    maxEcCount = Math.max(maxEcCount, ecCount);
                    dcdata[r] = new Array(dcCount);
                    for (var i = 0; i < dcdata[r].length; i++) {
                        dcdata[r][i] = 0xff & buffer.buffer[i + offset];
                    }
                    offset += dcCount;
                    var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
                    var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
                    var modPoly = rawPoly.mod(rsPoly);
                    ecdata[r] = new Array(rsPoly.getLength() - 1);
                    for (var i = 0; i < ecdata[r].length; i++) {
                        var modIndex = i + modPoly.getLength() - ecdata[r].length;
                        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
                    }
                }
                var totalCodeCount = 0;
                for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
                var data = new Array(totalCodeCount);
                var index = 0;
                for (var i = 0; i < maxDcCount; i++) {
                    for (var r = 0; r < rsBlocks.length; r++) {
                        if (i < dcdata[r].length) data[index++] = dcdata[r][i];
                    }
                }
                for (var i = 0; i < maxEcCount; i++) {
                    for (var r = 0; r < rsBlocks.length; r++) {
                        if (i < ecdata[r].length) data[index++] = ecdata[r][i];
                    }
                }
                return data;
            };

            function QR8bitByte(data) {
                this.mode = 4;
                this.data = data;
            }
            QR8bitByte.prototype = {
                getLength: function(buffer) {
                    return unescape(encodeURIComponent(this.data)).length;
                },
                write: function(buffer) {
                    var utf8Str = unescape(encodeURIComponent(this.data));
                    for (var i = 0; i < utf8Str.length; i++) {
                        buffer.put(utf8Str.charCodeAt(i), 8);
                    }
                }
            };

            var QRUtil = {
                PATTERN_POSITION_TABLE: [
                    [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50],
                    [6, 30, 54], [6, 32, 58], [6, 34, 62], [6, 26, 46, 66], [6, 26, 48, 70], [6, 26, 50, 74], [6, 30, 54, 78],
                    [6, 30, 56, 82], [6, 30, 58, 86], [6, 34, 62, 90], [6, 28, 50, 72, 94], [6, 26, 50, 74, 98], [6, 30, 54, 78, 102],
                    [6, 28, 54, 80, 106], [6, 32, 58, 84, 110], [6, 30, 58, 86, 114], [6, 34, 62, 90, 118], [6, 26, 50, 74, 98, 122],
                    [6, 30, 54, 78, 102, 126], [6, 26, 52, 78, 104, 130], [6, 30, 56, 82, 108, 134], [6, 34, 60, 86, 112, 138],
                    [6, 30, 58, 86, 114, 142], [6, 34, 62, 90, 118, 146], [6, 30, 54, 78, 102, 126, 150], [6, 24, 50, 76, 102, 128, 154],
                    [6, 28, 54, 80, 106, 132, 158], [6, 32, 58, 84, 110, 136, 162], [6, 26, 54, 82, 110, 138, 166], [6, 30, 58, 86, 114, 142, 170]
                ],
                G15: (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
                G18: (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
                G15_MASK: (1 << 14) | (1 << 12) | (1 << 10) | (1 << 4) | (1 << 1),
                getBCHTypeInfo: function(data) {
                    var d = data << 10;
                    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
                        d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
                    }
                    return ((data << 10) | d) ^ QRUtil.G15_MASK;
                },
                getBCHTypeNumber: function(data) {
                    var d = data << 12;
                    while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
                        d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
                    }
                    return (data << 12) | d;
                },
                getBCHDigit: function(data) {
                    var digit = 0;
                    while (data != 0) {
                        digit++;
                        data >>>= 1;
                    }
                    return digit;
                },
                getPatternPosition: function(typeNumber) {
                    return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
                },
                getMaskFunction: function(maskPattern) {
                    switch (maskPattern) {
                        case 0: return function(i, j) { return (i + j) % 2 == 0; };
                        case 1: return function(i, j) { return i % 2 == 0; };
                        case 2: return function(i, j) { return j % 3 == 0; };
                        case 3: return function(i, j) { return (i + j) % 3 == 0; };
                        case 4: return function(i, j) { return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 == 0; };
                        case 5: return function(i, j) { return (i * j) % 2 + (i * j) % 3 == 0; };
                        case 6: return function(i, j) { return ((i * j) % 2 + (i * j) % 3) % 2 == 0; };
                        case 7: return function(i, j) { return ((i * j) % 3 + (i + j) % 2) % 2 == 0; };
                    }
                },
                getErrorCorrectPolynomial: function(errorCorrectLength) {
                    var a = new QRPolynomial([1], 0);
                    for (var i = 0; i < errorCorrectLength; i++) {
                        a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
                    }
                    return a;
                },
                getLengthInBits: function(mode, type) {
                    if (1 <= type && type < 10) return 8;
                    else if (type < 27) return 16;
                    else return 16;
                },
                getLostPoint: function(qrCode) {
                    var moduleCount = qrCode.getModuleCount();
                    var lostPoint = 0;
                    for (var row = 0; row < moduleCount; row++) {
                        for (var col = 0; col < moduleCount; col++) {
                            var sameCount = 0;
                            var dark = qrCode.isDark(row, col);
                            for (var r = -1; r <= 1; r++) {
                                if (row + r < 0 || moduleCount <= row + r) continue;
                                for (var c = -1; c <= 1; c++) {
                                    if (col + c < 0 || moduleCount <= col + c) continue;
                                    if (r == 0 && c == 0) continue;
                                    if (dark == qrCode.isDark(row + r, col + c)) sameCount++;
                                }
                            }
                            if (sameCount > 5) lostPoint += (3 + sameCount - 5);
                        }
                    }
                    return lostPoint;
                }
            };

            var QRMath = {
                glog: function(n) {
                    if (n < 1) throw new Error("glog(" + n + ")");
                    return QRMath.LOG_TABLE[n];
                },
                gexp: function(n) {
                    while (n < 0) n += 255;
                    while (n >= 256) n -= 255;
                    return QRMath.EXP_TABLE[n];
                },
                EXP_TABLE: new Array(256),
                LOG_TABLE: new Array(256)
            };
            for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
            for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
            for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

            function QRPolynomial(num, shift) {
                var offset = 0;
                while (offset < num.length && num[offset] == 0) offset++;
                this.num = new Array(num.length - offset + shift);
                for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
            }
            QRPolynomial.prototype = {
                get: function(index) { return this.num[index]; },
                getLength: function() { return this.num.length; },
                multiply: function(e) {
                    var num = new Array(this.getLength() + e.getLength() - 1);
                    for (var i = 0; i < this.getLength(); i++) {
                        for (var j = 0; j < e.getLength(); j++) {
                            num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
                        }
                    }
                    return new QRPolynomial(num, 0);
                },
                mod: function(e) {
                    if (this.getLength() - e.getLength() < 0) return this;
                    var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
                    var num = new Array(this.getLength());
                    for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
                    for (var i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
                    return new QRPolynomial(num, 0).mod(e);
                }
            };

            function QRRSBlock(totalCount, dataCount) {
                this.totalCount = totalCount;
                this.dataCount = dataCount;
            }
            QRRSBlock.RS_BLOCK_TABLE = [
                [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
                [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
                [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
                [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
                [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12],
                [2, 86, 68], [4, 43, 27], [4, 43, 19], [4, 43, 15],
                [2, 98, 78], [4, 49, 31], [2, 32, 14, 4, 33, 15], [4, 39, 13, 1, 40, 14],
                [2, 121, 97], [2, 60, 38, 2, 61, 39], [4, 40, 18, 2, 41, 19], [4, 40, 14, 2, 41, 15],
                [2, 146, 116], [3, 58, 36, 2, 59, 37], [4, 36, 16, 4, 37, 17], [4, 36, 12, 4, 37, 13],
                [2, 86, 68, 2, 87, 69], [4, 69, 43, 1, 70, 44], [6, 43, 19, 2, 44, 20], [6, 43, 15, 2, 44, 16]
            ];
            QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
                var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
                var length = rsBlock.length / 3;
                var list = [];
                for (var i = 0; i < length; i++) {
                    var count = rsBlock[i * 3 + 0];
                    var totalCount = rsBlock[i * 3 + 1];
                    var dataCount = rsBlock[i * 3 + 2];
                    for (var j = 0; j < count; j++) list.push(new QRRSBlock(totalCount, dataCount));
                }
                return list;
            };
            QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {
                switch (errorCorrectLevel) {
                    case 1: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
                    case 0: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
                    case 3: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
                    case 2: return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
                }
            };

            function QRBitBuffer() {
                this.buffer = [];
                this.length = 0;
            }
            QRBitBuffer.prototype = {
                get: function(index) { return ((this.buffer[Math.floor(index / 8)] >>> (7 - index % 8)) & 1) == 1; },
                put: function(num, length) {
                    for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1);
                },
                getLengthInBits: function() { return this.length; },
                putBit: function(bit) {
                    var bufIndex = Math.floor(this.length / 8);
                    if (this.buffer.length <= bufIndex) this.buffer.push(0);
                    if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
                    this.length++;
                }
            };

            return {
                createCanvas: function(text, size) {
                    var qr = new QRCodeModel(0, 0); // M level
                    qr.addData(text);
                    qr.make();
                    var count = qr.getModuleCount();
                    var canvas = document.createElement('canvas');
                    canvas.width = size || 176;
                    canvas.height = size || 176;
                    var ctx = canvas.getContext('2d');
                    var tileW = canvas.width / count;
                    var tileH = canvas.height / count;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#090d16';
                    for (var r = 0; r < count; r++) {
                        for (var c = 0; c < count; c++) {
                            if (qr.isDark(r, c)) {
                                ctx.fillRect(Math.round(c * tileW), Math.round(r * tileH), Math.ceil(tileW), Math.ceil(tileH));
                            }
                        }
                    }
                    return canvas;
                }
            };
        })();

                }

                    mobBtnIcon.setAttribute('data-lucide', 'wallet');
                }

                if (mobSubHint) {
                    mobSubHint.innerText = '可保存二维码后使用手机QQ扫码识别';
                }
            } else {
                // 支付宝 (alipay)
                if (banner) {
                    banner.className = 'mb-6 p-2.5 rounded-2xl bg-blue-950/40 border border-blue-500/30 flex items-center justify-center gap-2 text-xs font-bold transition-all shadow-inner';
                }
                if (iconBox) {
                    iconBox.className = 'w-6 h-6 rounded-lg flex items-center justify-center bg-blue-500/20 text-blue-400 border border-blue-500/40';
                }
                if (icon) {
                    icon.setAttribute('data-lucide', 'shield-check');

                }

                    tipIcon.className = 'w-4 h-4 text-blue-400';

                    mobBtn.className = 'w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-2xl shadow-lg flex items-center justify-center gap-2 cursor-pointer transition-all shadow-blue-900/40';

                }

                    mobSubHint.innerText = '支持快速调起手机支付宝客户端完成付款';
                }
            }

            // 同步更新聚合 Tab 中的激活状态
            document.querySelectorAll('.pay-tab').forEach(b => {
                b.className = 'pay-tab text-slate-400 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 cursor-pointer hover:text-slate-200 transition-all';
            });
            const activeTabBtn = document.querySelector(`.${type}-tab`);
            if (activeTabBtn) {
                activeTabBtn.classList.add(`active-${type}`);

            safeCreateIcons();

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            tradeNo = urlParams.get('trade_no') || '';

            if (tradeNo) {
                fetchOrderDetails(tradeNo);
                startOrderPolling(tradeNo);
            } else {
                document.getElementById('order-subject').innerText = '订单参数无效';
                document.getElementById('order-amount').innerText = '--';
                document.getElementById('qrcode').innerHTML = '<div class="text-xs text-rose-500 font-bold">缺少平台流水号</div>';
            }

            safeCreateIcons();
            startTimer();

            if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
                const mobBtn = document.getElementById('mobile-btn');
                if (mobBtn) mobBtn.classList.remove('hidden');
            }
        });

        // 真实拉取订单详情
        function fetchOrderDetails(tNo) {
            fetch(`/api/order/query?trade_no=${encodeURIComponent(tNo)}&_t=${Date.now()}`, { cache: 'no-store' })
                .then(res => res.json())
                .then(res => {
                    if (res.code === 1 && res.data) {
                        const data = res.data;
                        document.getElementById('order-amount').innerText = data.price || data.money || data.amount || '0.00';
                        document.getElementById('order-subject').innerText = data.subject || data.name || '网络商品';
                        document.getElementById('order-trade-no').innerText = tNo;

                        // 依据订单类型自适应：单通道模式隐藏假 Tab，呈现该通道专属安全条
                        const isSingleMethod = data.pay_type && data.pay_type !== 'aggregate' && data.pay_type !== 'all';
                        const tabsContainer = document.getElementById('pay-tabs-container');
                        const singleBanner = document.getElementById('single-pay-banner');

                        if (isSingleMethod) {
                            if (tabsContainer) tabsContainer.classList.add('hidden');
                            if (singleBanner) singleBanner.classList.remove('hidden');
                        } else {
                            if (tabsContainer) tabsContainer.classList.remove('hidden');
                            if (singleBanner) singleBanner.classList.add('hidden');
                        }

                        // 应用对应的品牌视觉主题
                        const rawType = data.pay_type || data.pay_category || 'alipay';
                        applyPaymentTheme(rawType);

                        // 真实倒计时计算与过期状态判定
                        if (data.expire_time) {
                            const nowSec = Math.floor(Date.now() / 1000);
                            const remainSec = data.expire_time - nowSec;
                            if (remainSec > 0) {
                                countdown = remainSec;
                                isOrderExpired = false;
                            } else {
                                countdown = 0;
                                isOrderExpired = true;
                            }
                        }

                        // 如果订单已超时失效
                        if (isOrderExpired || data.status === -1 || data.status === 2) {
                            renderExpired();
                            return;
                        }

                        let finalQrUrl = (data.pay_url || '').trim();
                        if (finalQrUrl.startsWith('/')) {
                            finalQrUrl = window.location.origin + finalQrUrl;
                        }
                        window.lastPayUrl = finalQrUrl;
                        window.realQrUrl  = finalQrUrl;

                        // 若用户在手机支付宝 APP 内访问，且配置了 PID，秒级自动唤起原生支付宝付钱界面
                        const isAli = navigator.userAgent.toLowerCase().includes('alipayclient');
                        const aliPid = data.alipay_pid || (data.config && data.config.alipay_pid ? data.config.alipay_pid : '');
                        if (isAli && (window.realQrUrl.startsWith('alipays://') || aliPid)) {
                            const aliScheme = window.realQrUrl.startsWith('alipays://') ? window.realQrUrl : ("alipays://platformapi/startapp?appId=09999988&actionType=toAccount&recUserId=" + aliPid + "&amount=" + (data.price || data.money) + "&memo=" + encodeURIComponent("CX" + tNo));
                            window.location.replace(aliScheme);
                            return;
                        }

                        // 渲染二维码
                        const isCashierSelfUrl = window.realQrUrl && window.realQrUrl.includes('/cashier/index.html');
                        if (window.realQrUrl && !isCashierSelfUrl) {
                            renderQr(window.realQrUrl);
                        } else {
                            document.getElementById("qrcode").innerHTML = `
                                <div class="text-center p-3 space-y-2">
                                    <div class="w-10 h-10 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg">
                                        !
                                    </div>
                                    <div class="text-xs font-extrabold text-slate-800">正在生成收款码...</div>
                                    <button onclick="fetchOrderDetails('${escapeHtml(tNo)}')" class="text-xs px-3 py-1.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-500 cursor-pointer">点击刷新</button>
                                </div>
                            `;
                        }

                        if (data.status === 1) {
                            showPaidMask();
                        }
                    } else {
                        const errMsg = res.msg || '订单不存在或已失效';
                        document.getElementById("qrcode").innerHTML = `
                            <div class="text-center p-3 space-y-2">
                                <div class="text-xs text-rose-500 font-bold">${escapeHtml(errMsg)}</div>
                                <button onclick="fetchOrderDetails('${escapeHtml(tNo)}')" class="text-xs px-3 py-1 bg-slate-800 text-slate-200 rounded-lg hover:bg-slate-700 cursor-pointer">点击重试</button>
                            </div>
                        `;
                    }
                })
                .catch((err) => {
                    console.error('[CXPAY Cashier Fetch Error]', err);
                    document.getElementById("qrcode").innerHTML = `
                        <div class="text-center p-3 space-y-2">
                            <div class="text-xs text-rose-500 font-bold">网络请求异常</div>
                            <button onclick="fetchOrderDetails('${escapeHtml(tNo)}')" class="text-xs px-3 py-1.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-500 cursor-pointer">重新加载</button>
                        </div>
                    `;
                });
        }

        // 订单超时失效渲染
        function renderExpired() {
            isOrderExpired = true;
            if (pollTimer) clearInterval(pollTimer);
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.innerText = '已失效';
                timerEl.parentElement.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-rose-500/20 border border-rose-500/30 text-rose-400 text-xs font-mono font-bold';
            }
            document.getElementById("qrcode").innerHTML = `
                <div class="text-center p-4 space-y-2">
                    <div class="w-12 h-12 mx-auto rounded-full bg-rose-500/10 text-rose-500 flex items-center justify-center font-bold text-xl">
                        !
                    </div>
                    <div class="text-sm font-black text-slate-800">订单已超时失效</div>
                    <div class="text-[11px] text-slate-500">支付时效已过，请返回商户重新下单</div>
                </div>
            `;
            const tipText = document.getElementById('qr-tip-text');
            if (tipText) tipText.innerText = '订单已超时关闭，请勿继续支付';
            const mobBtnWrap = document.getElementById('mobile-btn');
            if (mobBtnWrap) mobBtnWrap.classList.add('hidden');
        }

        // 真实轮询订单状态
        function startOrderPolling(tNo) {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(() => {
                if (isOrderExpired) {
                    clearInterval(pollTimer);
                    return;
                }
                fetch(`/api/order/query?trade_no=${encodeURIComponent(tNo)}&_t=${Date.now()}`, { cache: 'no-store' })
                    .then(res => res.json())
                    .then(res => {
                        if (res.code === 1 && res.data) {
                            if (res.data.status == 1 || res.data.status === '1') {
                                clearInterval(pollTimer);
                                showPaidMask();
                                setTimeout(() => {
                                    if (res.data.return_url) {
                                        window.location.href = res.data.return_url;
                                    }
                                }, 1500);
                            } else if (res.data.status === 2 || res.data.status === -1) {
                                renderExpired();
                            }
                        }
                    })
                    .catch(() => {});
            }, 1500);
        }

        function showPaidMask() {
            const mask = document.getElementById('paid-mask');
            if (mask) mask.classList.remove('hidden');
            playSuccessVoice();
        }

        function playSuccessVoice() {
            try {
                const savedCfg = JSON.parse(localStorage.getItem('cx_cashier_config') || '{}');
                if (savedCfg.tts_enabled === false) return;
                if (!('speechSynthesis' in window)) return;

                const amountText = document.getElementById('order-amount')?.innerText || '0.00';
                const currentTab = currentPayType === 'alipay' ? '支付宝' : (currentPayType === 'wxpay' ? '微信支付' : 'QQ钱包');
                
                window.speechSynthesis.cancel();
                const speechText = `${currentTab}收款到账 ${amountText} 元`;
                const msg = new SpeechSynthesisUtterance(speechText);
                msg.lang = 'zh-CN';
                msg.rate = 1.0;
                msg.pitch = 1.0;
                window.speechSynthesis.speak(msg);
            } catch (e) {}
        }

        function renderQr(url) {
            const container = document.getElementById("qrcode");
            if (!container) return;
            container.innerHTML = "";

            if (!url) {
                container.innerHTML = `<div class="text-xs text-slate-400 font-medium">暂无二维码数据</div>`;
                return;
            }

            // 1. 如果是静态图片 URL 或 Base64
            if (url.startsWith('data:image') || url.startsWith('blob:') || /\.(png|jpg|jpeg|gif|webp)(\?.*)?$/i.test(url) || url.includes('/uploads/') || url.includes('/attachment/')) {
                container.innerHTML = `<img src="${escapeHtml(url)}" alt="收款码" class="w-44 h-44 object-contain rounded-xl shadow-inner mx-auto bg-white p-1" />`;
                return;
            }

            // 2. 优先使用本地内置零依赖 Canvas 二维码引擎瞬间秒画
            try {
                const canvas = QRCodeLib.createCanvas(url, 176);
                canvas.className = 'w-44 h-44 rounded-xl shadow-inner mx-auto bg-white p-1';
                container.appendChild(canvas);
                return;
            } catch (e) {
                console.warn('[QRCode Canvas Fail, fallback to img]', e);
            }

            // 3. 兜底容灾：静态图片 API
            const fallbackQrImg = `https://api.pwmqr.com/qrcode/create/?url=${encodeURIComponent(url)}`;
            container.innerHTML = `<img src="${fallbackQrImg}" alt="收款码" class="w-44 h-44 object-contain rounded-xl shadow-inner mx-auto bg-white p-1" onerror="this.onerror=null; this.src='https://api.qrserver.com/v1/create-qr-code/?size=176x176&data=${encodeURIComponent(url)}';" />`;
        }

        function toggleTheme() {
            isDark = !isDark;
            const root = document.getElementById('html-root');
            const icon = document.getElementById('theme-icon');

            if (root) {
                root.className = isDark ? 'dark' : 'light';
            }
            if (icon) {
                icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            }
            safeCreateIcons();
        }

        // 聚合模式下手动切换 Tab
        function switchTab(rawType) {
            applyPaymentTheme(rawType);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isOrderExpired) return;
                if (countdown > 0) {
                    countdown--;
                    const m = String(Math.floor(countdown / 60)).padStart(2, '0');
                    const s = String(countdown % 60).padStart(2, '0');
                    const timerEl = document.getElementById('timer');
                    if (timerEl) timerEl.innerText = `${m}:${s}`;
                } else {
                    renderExpired();
                }
            }, 1000);
        }

        // 页面从后台切回（买家付款完毕返回浏览器）瞬间，立即秒级核销并跳回发卡网
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && tradeNo && !isOrderExpired) {
                checkOrderStatusImmediately(tradeNo);
            }
        });
        window.addEventListener('focus', () => {
            if (tradeNo && !isOrderExpired) {
                checkOrderStatusImmediately(tradeNo);
            }
        });

        function checkOrderStatusImmediately(tNo) {
            fetch(`/api/order/query?trade_no=${encodeURIComponent(tNo)}&_t=${Date.now()}`, { cache: 'no-store' })
                .then(res => res.json())
                .then(res => {
                    if (res.code === 1 && res.data && (res.data.status == 1 || res.data.status === '1')) {
                        if (pollTimer) clearInterval(pollTimer);
                        showPaidMask();
                        setTimeout(() => {
                            if (res.data.return_url) {
                                window.location.href = res.data.return_url;
                            }
                        }, 800);
                    }
                })
                .catch(() => {});
        }

        function openApp() {
            if (isOrderExpired) {
                alert('订单已超时失效，请返回商户重新下单！');
                return;
            }
            const ua = navigator.userAgent.toLowerCase();
            const isAli = ua.includes('alipayclient');
            const isWx = ua.includes('micromessenger');
            const realQr = window.realQrUrl || '';

            // 1. 如果当前是微信支付
            if (currentPayType === 'wxpay') {
                if (isWx && (realQr.startsWith('wxp://') || realQr.includes('weixin.qq.com'))) {
                    window.location.href = realQr;
                    return;
                }
                alert('请截屏或长按保存上方二维码，打开手机微信「扫一扫」从相册选择识别支付；付款完成后返回本页面即可自动查收卡密！');
                return;
            }

            // 2. 如果当前是支付宝
            if (currentPayType === 'alipay') {
                // 情况 A：买家已经在支付宝客户端内访问（通过内置容器直开收银台）
                if (isAli) {
                    if (realQr) {
                        const payTarget = realQr.startsWith('alipays://') ? realQr : ("alipays://platformapi/startapp?saId=10000007&qrcode=" + encodeURIComponent(realQr));
                        window.location.href = payTarget;
                        return;
                    }
                    alert('请识别上方二维码完成支付');
                    return;
                }

                // 情况 B：买家在手机外部浏览器访问
                // 优先拉起支付宝内置应用容器打开收银台（可在支付宝内付款后直接秒跳商品发货页，真正免切回）
                const inAppCashierUrl = "alipays://platformapi/startapp?appId=20000067&url=" + encodeURIComponent(window.location.href);

                // 准备备用原生拉起协议
                const fallbackQrTarget = (realQr && (realQr.startsWith('alipays://') || realQr.startsWith('https://qr.alipay.com/')))
                    ? (realQr.startsWith('alipays://') ? realQr : ("alipays://platformapi/startapp?saId=10000007&qrcode=" + encodeURIComponent(realQr)))
                    : ("alipays://platformapi/startapp?saId=10000007&qrcode=" + encodeURIComponent(window.location.href));

                // 更新底部提示与操作指引
                const hintEl = document.getElementById('mobile-sub-hint');
                if (hintEl) {
                    hintEl.innerHTML = `已唤起支付宝付款。若未自动跳出商品，请 <span class="text-blue-400 font-bold underline cursor-pointer" onclick="checkOrderStatusImmediately('${escapeHtml(tradeNo)}')">返回此处点击查验发货</span>`;
                }

                // 尝试通过支付宝内嵌容器直开当前收银台
                window.location.href = inAppCashierUrl;

                // 2 秒后若还在外部浏览器，提供无缝备用拉起
                setTimeout(() => {
                    const fallbackBtn = document.getElementById('mobile-pay-btn');
                    if (fallbackBtn) {
                        fallbackBtn.onclick = function() { window.location.href = fallbackQrTarget; };
                        const btnText = document.getElementById('mobile-btn-text');
                        if (btnText) btnText.innerText = '唤起支付 / 备用扫码付';
                    }
                }, 2000);
                return;
            }

            // 3. QQ钱包
            alert('请截屏或保存上方二维码，打开手机QQ「扫一扫」完成支付');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
