<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="100%" height="100%">
  <defs>
    <!-- 徽标背景渐变 -->
    <radialGradient id="iconBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f1d38" />
      <stop offset="60%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- 徽标边框 -->
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#1e40af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8" />
    </linearGradient>

    <!-- 图标 C 渐变 -->
    <linearGradient id="fullGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 图标 X 渐变 1 -->
    <linearGradient id="fullGradX1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- 图标 X 渐变 2 -->
    <linearGradient id="fullGradX2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 文字 CX 品牌渐变 -->
    <linearGradient id="textGradBrand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- 文字 PAY 金融渐变 -->
    <linearGradient id="textGradPay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 左侧独立徽标 (按比例缩放放置在 (16, 16) 区域，宽 128 高 128) -->
  <g transform="translate(16, 16) scale(0.25)">
    <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="8" />
    <g filter="url(#fullGlow)">
      <path d="M 270 120 L 205 120 C 145 120, 95 168, 95 230 L 95 282 C 95 344, 145 392, 205 392 L 270 392 L 270 332 L 210 332 C 180 332, 155 310, 155 280 L 155 232 C 155 202, 180 180, 210 180 L 270 180 Z" fill="url(#fullGradC)" />
      <path d="M 235 120 L 295 120 L 415 308 L 415 392 L 355 392 L 282 278 L 235 348 L 190 348 L 250 256 Z" fill="url(#fullGradX1)" />
      <path d="M 355 120 L 415 120 L 305 290 L 260 220 Z" fill="url(#fullGradX2)" />
      <polygon points="268,220 286,220 258,290 280,290 244,342 254,272 238,272" fill="#ffffff" />
    </g>
  </g>

  <!-- 右侧品牌文字组 -->
  <g transform="translate(170, 0)">
    <!-- CXPAY 主字标 -->
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      <tspan fill="url(#textGradBrand)">CX</tspan>
      <tspan fill="url(#textGradPay)">PAY</tspan>
    </text>

    <!-- 版本 / 规格小胶囊标签 -->
    <rect x="250" y="52" width="56" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <text x="278" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="800" font-size="11" fill="#38bdf8" text-anchor="middle">v2.5</text>

    <!-- 下方金融级产品定位说明 -->
    <text x="2" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="13" fill="#64748b" letter-spacing="4">
      AGGREGATED PAYMENT GATEWAY
    </text>

    <!-- 微动态装饰光线 -->
    <line x1="2" y1="138" x2="380" y2="138" stroke="url(#textGradBrand)" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round" />
  </g>
</svg>
