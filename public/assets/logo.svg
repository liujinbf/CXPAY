<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景舱体渐变 (深邃微渐变，带有精密科技微光) -->
    <radialGradient id="logoBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f1d38" />
      <stop offset="60%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- 舱体高光边框 -->
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#1e40af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.8" />
    </linearGradient>

    <!-- C 弧聚合渐变 -->
    <linearGradient id="logoGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- X 穿透主刃渐变 -->
    <linearGradient id="logoGradX1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- X 向上切刃渐变 -->
    <linearGradient id="logoGradX2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 极速闪电高亮渐变 -->
    <linearGradient id="logoPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 顶部高光倒角弧线 -->
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 立体圆角 Squircle 舱体 -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#logoBg)" stroke="url(#logoBorder)" stroke-width="6" />

  <!-- 顶部精密玻璃反光高光 -->
  <path d="M 120 28 L 392 28 Q 440 28 460 70 L 400 130 Q 300 70 120 70 Z" fill="url(#specularGlint)" />

  <!-- 核心图腾徽标组 -->
  <g filter="url(#logoGlow)">
    <!-- 字母 C：左侧聚合弧 -->
    <path d="M 270 120 
             L 205 120 
             C 145 120, 95 168, 95 230 
             L 95 282 
             C 95 344, 145 392, 205 392 
             L 270 392 
             L 270 332 
             L 210 332 
             C 180 332, 155 310, 155 280 
             L 155 232 
             C 155 202, 180 180, 210 180 
             L 270 180 
             Z" 
          fill="url(#logoGradC)" />

    <!-- 字母 X：主穿透切刃 -->
    <path d="M 235 120 
             L 295 120 
             L 415 308 
             L 415 392 
             L 355 392 
             L 282 278 
             L 235 348 
             L 190 348 
             L 250 256 
             Z" 
          fill="url(#logoGradX1)" />

    <!-- 字母 X：次切刃 -->
    <path d="M 355 120 
             L 415 120 
             L 305 290 
             L 260 220 
             Z" 
          fill="url(#logoGradX2)" />

    <!-- 核心闪电脉冲晶核 -->
    <polygon points="268,220 286,220 258,290 280,290 244,342 254,272 238,272" 
             fill="url(#logoPulse)" />
  </g>
</svg>
