<!DOCTYPE html>
<html lang="zh-CN" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CXPAY - 商户服务与结算中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        .tab-filter-active { background: #2563eb; color: #ffffff; font-weight: 700; }
        .nav-group-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px 4px; }
    </style>
</head>

<body class="h-full text-slate-700">
    <div id="app" class="min-h-full flex">
        <!-- 侧边栏 Sidebar (级联分组) -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 select-none">
            <div class="overflow-y-auto flex-1">
                <div class="flex items-center gap-3 px-2 py-3 mb-4 border-b border-slate-100">
                    <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-sm shadow-md">CX</div>
                    <div>
                        <span class="text-base font-extrabold text-slate-800 tracking-tight">商户服务中心</span>
                        <span class="block text-[10px] text-emerald-600 font-mono font-bold">PID: M5606680520</span>
                    </div>
                </div>

                <nav class="space-y-1 text-xs">
                    <!-- 1. 概览与看板 -->
                    <div class="nav-group-title">概览与看板</div>
                    <a @click="activeMenu = 'dashboard'" :class="activeMenu === 'dashboard' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue-500"></i> 数据仪表盘
                    </a>

                    <!-- 2. 通道与收款码 -->
                    <div class="nav-group-title">收款通道与绑定</div>
                    <a @click="activeMenu = 'my-channels'" :class="activeMenu === 'my-channels' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer font-bold text-emerald-600 transition-colors">
                        <i data-lucide="qr-code" class="w-4 h-4 text-emerald-500"></i> 📷 微信/支付宝/QQ收款码绑定
                    </a>

                    <!-- 3. 财务与提现结算 -->
                    <div class="nav-group-title">财务与提现结算</div>
                    <a @click="activeMenu = 'payout-request'" :class="activeMenu === 'payout-request' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors">
                        <i data-lucide="banknote" class="w-4 h-4 text-emerald-600"></i> 💳 申请提现与结算记录
                    </a>
                    <a @click="activeMenu = 'finance-log'" :class="activeMenu === 'finance-log' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors">
                        <i data-lucide="history" class="w-4 h-4 text-indigo-500"></i> 交易流水与扣费账单
                    </a>

                    <!-- 4. API 对接与安全 -->
                    <div class="nav-group-title">开发与对接</div>
                    <a @click="activeMenu = 'api-keys'" :class="activeMenu === 'api-keys' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors">
                        <i data-lucide="key" class="w-4 h-4 text-amber-500"></i> API 密钥与回调配置
                    </a>
                    <a @click="activeMenu = 'profile'" :class="activeMenu === 'profile' ? 'bg-blue-50 text-blue-600 font-bold' : 'text-slate-600 hover:bg-slate-50'" class="flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors">
                        <i data-lucide="user" class="w-4 h-4 text-slate-600"></i> 账户设置与资料
                    </a>
                </nav>
            </div>

            <div class="pt-3 border-t border-slate-100 text-xs text-slate-400">
                <span>商户余额: <strong class="text-emerald-600 font-extrabold">¥ 150.00</strong></span>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- 顶部 Bar -->
            <header class="bg-white border-b border-slate-200 px-8 py-3.5 flex items-center justify-between shadow-sm">
                <div class="text-xs text-slate-400">商户服务中心 / <span class="text-slate-700 font-bold uppercase">{{ activeMenu }}</span></div>
                <div class="flex items-center gap-4 text-xs">
                    <span class="text-slate-600 font-bold">极客体验商户 👋</span>
                    <button class="px-3 py-1 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-md">退出登录</button>
                </div>
            </header>

            <div class="p-8 space-y-6 flex-1 overflow-y-auto">
                <!-- 1. Dashboard 视图 -->
                <template v-if="activeMenu === 'dashboard'">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-800">你好，极客体验商户 👋</h2>
                            <p class="text-xs text-slate-400 mt-1">以下是您今天的交易与成功率实时概览</p>
                        </div>
                        <div class="flex bg-slate-200/60 p-1 rounded-xl text-xs space-x-1">
                            <button @click="timeFilter = 'today'" :class="timeFilter === 'today' ? 'tab-filter-active' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg transition-all">今日</button>
                            <button @click="timeFilter = 'week'" :class="timeFilter === 'week' ? 'tab-filter-active' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg transition-all">本周</button>
                            <button @click="timeFilter = 'month'" :class="timeFilter === 'month' ? 'tab-filter-active' : 'text-slate-600'" class="px-3 py-1.5 rounded-lg transition-all">本月</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-xs text-slate-400 font-medium">累计交易额</div>
                                <div class="text-2xl font-extrabold text-slate-800 mt-1">¥ 1,280.50</div>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold">💳</div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-xs text-slate-400 font-medium">成功订单数</div>
                                <div class="text-2xl font-extrabold text-emerald-600 mt-1">128</div>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg font-bold">🧾</div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-xs text-slate-400 font-medium">已绑定收款码</div>
                                <div class="text-2xl font-extrabold text-slate-800 mt-1">3 个</div>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg font-bold">📷</div>
                        </div>

                        <div class="glass-card p-5 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-xs text-slate-400 font-medium">账户可提现余额</div>
                                <div class="text-2xl font-extrabold text-emerald-600 mt-1">¥ 150.00</div>
                            </div>
                            <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-lg font-bold">💰</div>
                        </div>
                    </div>

                    <!-- 图表区域 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-card p-6 rounded-2xl md:col-span-2 space-y-4">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">📈 24小时收款趋势</h3>
                            <div id="trendChart" class="w-full h-64"></div>
                        </div>

                        <div class="glass-card p-6 rounded-2xl space-y-4">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">🕒 支付通道占比</h3>
                            <div id="pieChart" class="w-full h-64"></div>
                        </div>
                    </div>
                </template>

                <!-- 2. 申请提现与结算 View -->
                <template v-else-if="activeMenu === 'payout-request'">
                    <div class="glass-card p-6 rounded-2xl space-y-6">
                        <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                            <div>
                                <h3 class="text-base font-extrabold text-slate-800">💳 申请账户余额提现 / 自动结算</h3>
                                <p class="text-xs text-slate-400 mt-1">将您的账户可用余额结算至支付宝、微信或银行卡账号</p>
                            </div>
                            <button @click="showPayoutModal = true" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md">+ 发起提现申请</button>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">历史提现明细</h4>
                            <table class="w-full text-left text-xs text-slate-600">
                                <thead class="bg-slate-50 uppercase font-semibold border-b">
                                    <tr>
                                        <th class="p-3">申请时间</th>
                                        <th class="p-3">提现金额</th>
                                        <th class="p-3">打款方式</th>
                                        <th class="p-3">状态</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <tr>
                                        <td class="p-3 font-mono">2026-07-26 12:00</td>
                                        <td class="p-3 font-bold text-emerald-600">¥ 500.00</td>
                                        <td class="p-3">支付宝 (138****0000)</td>
                                        <td class="p-3"><span class="px-2.5 py-0.5 bg-amber-100 text-amber-700 font-bold rounded-full">审核中</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>

                <!-- 3. 个人码绑定 View -->
                <template v-else-if="activeMenu === 'my-channels'">
                    <div class="glass-card p-6 rounded-2xl space-y-6">
                        <div>
                            <h3 class="text-base font-extrabold text-slate-800">📷 微信/支付宝/QQ 个人收款码绑定与上传</h3>
                            <p class="text-xs text-slate-400 mt-1">自动识别二维码解码，绑定后由挂机助手推送到账流水实现零图片出码</p>
                        </div>

                        <div class="p-6 border-2 border-dashed border-blue-200 rounded-2xl bg-blue-50/50 text-center space-y-3">
                            <input type="file" ref="qrFileInput" @change="handleQrUpload" class="hidden" accept="image/*">
                            <div class="w-12 h-12 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto text-xl shadow-lg">📷</div>
                            <div class="text-xs font-bold text-slate-700">点击上传微信/支付宝/QQ个人收款码图片</div>
                            <button @click="$refs.qrFileInput.click()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md cursor-pointer">选择二维码文件</button>
                        </div>
                    </div>
                </template>

                <!-- 4. API 对接密钥 View -->
                <template v-else-if="activeMenu === 'api-keys'">
                    <div class="glass-card p-6 rounded-2xl space-y-6">
                        <div class="border-b border-slate-200 pb-4">
                            <h3 class="text-base font-extrabold text-slate-800">🔑 API 对接参数与签名密钥</h3>
                            <p class="text-xs text-slate-400 mt-1">用于易支付通用接口或原生 API 网关快速集成</p>
                        </div>

                        <div class="space-y-4 text-xs max-w-xl">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">商户 PID (pid)</label>
                                <input type="text" readonly value="M5606680520" class="w-full px-4 py-2 border rounded-xl font-mono bg-slate-50 font-bold text-blue-600">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">商户 MD5 密钥 (key)</label>
                                <input type="text" readonly value="8d7f3a9e2c1b4a5f6e8d9c0b1a2f3e4d" class="w-full px-4 py-2 border rounded-xl font-mono bg-slate-50">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">网关发起支付 API URL</label>
                                <input type="text" readonly value="https://cxpay.onrender.com/submit.php" class="w-full px-4 py-2 border rounded-xl font-mono bg-slate-50">
                            </div>
                        </div>
                    </div>
                </template>

            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;
        createApp({
            setup() {
                const activeMenu = ref('dashboard');
                const timeFilter = ref('today');
                const showPayoutModal = ref(false);

                onMounted(() => {
                    nextTick(() => {
                        if (window.lucide) lucide.createIcons();
                        initCharts();
                    });
                });

                function initCharts() {
                    const trendDom = document.getElementById('trendChart');
                    if (trendDom) {
                        const trendChart = echarts.init(trendDom);
                        trendChart.setOption({
                            tooltip: { trigger: 'axis' },
                            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                            xAxis: { type: 'category', data: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'] },
                            yAxis: { type: 'value' },
                            series: [{ data: [120, 300, 450, 800, 650, 1280], type: 'line', smooth: true, itemStyle: { color: '#10b981' } }]
                        });
                    }

                    const pieDom = document.getElementById('pieChart');
                    if (pieDom) {
                        const pieChart = echarts.init(pieDom);
                        pieChart.setOption({
                            tooltip: { trigger: 'item' },
                            series: [{
                                type: 'pie',
                                radius: ['50%', '70%'],
                                data: [
                                    { value: 650, name: '微信支付', itemStyle: { color: '#10b981' } },
                                    { value: 500, name: '支付宝', itemStyle: { color: '#2563eb' } },
                                    { value: 130, name: 'QQ钱包', itemStyle: { color: '#38bdf8' } }
                                ]
                            }]
                        });
                    }
                }

                function handleQrUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    alert('已接收二维码图片，解析绑码成功！');
                }

                return { activeMenu, timeFilter, showPayoutModal, handleQrUpload };
            }
        }).mount('#app');
    </script>
</body>

</html>
