<!DOCTYPE html>
<html lang="zh-CN" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CXPAY - 商户服务与控制中心</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.294.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        .nav-group-title { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px 4px; }
        .nav-link-active { background-color: #eff6ff !important; color: #2563eb !important; font-weight: 700 !important; }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden text-slate-700">
    <div id="app" class="h-screen w-screen flex overflow-hidden">
        
        <!-- 侧边栏 Sidebar (CXPAY 5 大主菜单规范) -->
        <aside class="w-64 h-full bg-white border-r border-slate-200 flex flex-col justify-between p-4 select-none flex-shrink-0">
            <div class="overflow-y-auto flex-1">
                <!-- 顶部 Logo 标识 -->
                <div class="flex items-center gap-3 px-2 py-3 mb-4 border-b border-slate-100">
                    <img src="/favicon.svg" alt="CXPAY Logo" class="w-9 h-9 rounded-xl shadow-md shadow-sky-500/20">
                    <div>
                        <span class="text-base font-extrabold text-slate-800 tracking-tight">CXPAY 控制中心</span>
                        <span id="sidebar-merchant-pid" class="block text-[10px] text-emerald-600 font-mono font-bold">PID: --</span>
                    </div>
                </div>

                <nav class="space-y-1 text-xs">
                    <!-- 1. 首页概览 -->
                    <div class="nav-group-title">首页与概览</div>
                    <a data-tab="dashboard" id="nav-dashboard" class="nav-btn nav-link-active flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="layout-dashboard" class="w-4 h-4 text-blue-500"></i> 首页概览
                    </a>

                    <!-- 2. 账户设置 -->
                    <div class="nav-group-title">账户与设置</div>
                    <a data-tab="profile" id="nav-profile" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="user-cog" class="w-4 h-4 text-indigo-500"></i> 账户设置
                    </a>
                    <a data-tab="notice-config" id="nav-notice-config" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="bell" class="w-4 h-4 text-rose-500"></i> 通知设置
                    </a>

                    <!-- 3. 通道管理 -->
                    <div class="nav-group-title">通道与配置</div>
                    <a data-tab="channel-list" id="nav-channel-list" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer font-bold transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="qr-code" class="w-4 h-4 text-emerald-500"></i> 通道管理
                    </a>
                    <a data-tab="channel-config" id="nav-channel-config" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="sliders" class="w-4 h-4 text-blue-600"></i> 通道配置
                    </a>
                    <a data-tab="poll-group" id="nav-poll-group" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="network" class="w-4 h-4 text-purple-500"></i> 轮询组
                    </a>

                    <!-- 4. 财务与订单明细 -->
                    <div class="nav-group-title">订单与财务</div>
                    <a data-tab="order-list" id="nav-order-list" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer font-bold transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="receipt" class="w-4 h-4 text-emerald-500"></i> 订单记录
                    </a>
                    <a data-tab="finance-log" id="nav-finance-log" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="wallet" class="w-4 h-4 text-amber-500"></i> 财务明细
                    </a>
                    <a data-tab="plan-buy" id="nav-plan-buy" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="gem" class="w-4 h-4 text-purple-500"></i> 套餐订阅与升级
                    </a>

                    <!-- 5. API 配置 -->
                    <div class="nav-group-title">开发与对接</div>
                    <a data-tab="api-keys" id="nav-api-keys" class="nav-btn flex items-center gap-3 px-4 py-2.5 rounded-xl cursor-pointer transition-colors text-slate-600 hover:bg-slate-50">
                        <i data-lucide="key-round" class="w-4 h-4 text-rose-500"></i> API 对接与密钥
                    </a>

                </nav>
            </div>

            <!-- 底部账户服务费余额 -->
            <div class="pt-3 border-t border-slate-100 text-xs text-slate-400 flex items-center justify-between">
                <div>
                    <span>服务费:</span>
                    <strong id="sidebar-merchant-balance" class="text-emerald-600 font-extrabold text-sm ml-1">¥ --</strong>
                </div>
                <button type="button" data-action="top-recharge" class="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-extrabold text-[11px] rounded-lg border border-emerald-200 transition-colors cursor-pointer flex items-center gap-1">
                    <i data-lucide="plus-circle" class="w-3 h-3 text-emerald-600"></i> 充值
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="flex-1 h-full flex flex-col min-w-0 overflow-hidden bg-slate-50">
            <!-- 顶部 Header Bar -->
            <header class="bg-white border-b border-slate-200 px-8 py-3.5 flex items-center justify-between shadow-sm flex-shrink-0">
                <div class="text-xs text-slate-400">商户服务中心 / <span id="current-tab-title" class="text-slate-700 font-bold uppercase">首页概览</span></div>
                <div class="flex items-center gap-4 text-xs">
                    <button type="button" data-action="top-recharge" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl transition-all shadow-sm flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="wallet" class="w-3.5 h-3.5"></i> 充值服务费
                    </button>
                    <span id="header-merchant-label" class="text-slate-600 font-bold flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500"></i> 商户信息加载中
                    </span>
                    <button data-action="logout-merchant" class="px-3 py-1 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-md transition-colors">退出登录</button>
                </div>
            </header>

            <div class="p-8 space-y-6 flex-1 overflow-y-auto min-h-0">
                <div id="merchant-feature-root" class="hidden"></div>

            </div>
        </main>
    </div>

    <script type="module" src="/merchant/assets/app.js?v=merchant-v20260822_2135_final"></script>
</body>
</html>
