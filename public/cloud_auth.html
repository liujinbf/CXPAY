<!DOCTYPE html>
<html lang="zh-CN" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端 · 授权中心 - CXPAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid #e2e8f0; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); }
        .btn-primary { background: linear-gradient(135deg, #0052d9 0%, #003699 100%); }
    </style>
</head>

<body class="h-full text-slate-700 flex flex-col">
    <div id="app" class="min-h-full flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-white border-b border-slate-200 px-8 py-3.5 flex items-center justify-between shadow-sm sticky top-0 z-30">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-black text-sm">☁️</div>
                    <span class="font-extrabold text-lg tracking-tight text-slate-800">云端 · 授权中心</span>
                </div>
                <nav class="flex gap-2">
                    <button @click="activeTab = 'my-license'" :class="activeTab === 'my-license' ? 'bg-blue-600 text-white font-bold' : 'text-slate-600 hover:bg-slate-100'" class="px-4 py-1.5 rounded-full text-xs transition-all">我的授权</button>
                    <button @click="activeTab = 'buy-renew'" :class="activeTab === 'buy-renew' ? 'bg-blue-600 text-white font-bold' : 'text-slate-600 hover:bg-slate-100'" class="px-4 py-1.5 rounded-full text-xs transition-all">购买续费</button>
                    <button @click="activeTab = 'download'" :class="activeTab === 'download' ? 'bg-blue-600 text-white font-bold' : 'text-slate-600 hover:bg-slate-100'" class="px-4 py-1.5 rounded-full text-xs transition-all">下载中心</button>
                </nav>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <span class="text-slate-500">已绑定买家 QQ: <strong class="text-blue-600 font-mono font-bold">1008611</strong></span>
                <button @click="showQqModal = true" class="px-3 py-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold rounded-lg transition-colors flex items-center gap-1">
                    🐧 QQ 扫码/快捷登录绑定
                </button>
                <button class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md font-medium">退出</button>
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

            <!-- TAB 1: 我的授权 -->
            <template v-if="activeTab === 'my-license'">
                <!-- 我的授权站点卡片 -->
                <div class="glass-card rounded-2xl p-6 space-y-2">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">我的授权站点</div>
                    <div class="flex items-center justify-between">
                        <div class="text-lg font-extrabold text-blue-600">m.fcwan.cn <span class="text-xs text-slate-400 font-normal ml-2">上级联系：CXPAY</span></div>
                    </div>
                </div>

                <!-- 站点安全与授权密钥 -->
                <div class="glass-card rounded-2xl p-6 space-y-4">
                    <h3 class="text-sm font-bold text-slate-800">站点安全</h3>
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <div>
                            <div class="text-xs text-slate-400">授权域名</div>
                            <div class="text-sm font-bold text-slate-700 mt-1">m.fcwan.cn</div>
                        </div>
                        <button class="px-4 py-1.5 border border-blue-500 text-blue-600 hover:bg-blue-50 rounded-full text-xs font-bold">更换域名</button>
                    </div>

                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-xs text-slate-400">授权密钥</div>
                            <div class="text-sm font-mono font-bold text-slate-700 mt-1">a61463******2893 <span class="text-xs text-blue-500 cursor-pointer ml-1">复制</span></div>
                        </div>
                        <button class="px-4 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-full text-xs font-bold">重置密钥</button>
                    </div>
                    <div class="text-[11px] text-slate-400 pt-2">为防止滥用，更换域名与重置密钥每 7 天允许操作一次；操作后请同步更新客户端云端配置。</div>
                </div>

                <!-- 云端授权模块卡片矩阵 -->
                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
                    <div v-for="item in moduleList" :key="item.name" class="glass-card rounded-2xl p-5 text-center space-y-3">
                        <div class="font-bold text-sm text-slate-800">{{ item.name }}</div>
                        <div :class="item.status === '已到期' ? 'text-rose-500' : 'text-emerald-500'" class="text-xs font-bold">{{ item.status }}</div>
                        <button @click="activeTab = 'buy-renew'" class="w-full py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold rounded-lg transition-colors">续费</button>
                    </div>
                </div>
            </template>

            <!-- TAB 2: 购买续费 -->
            <template v-if="activeTab === 'buy-renew'">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div v-for="pkg in pricingPackages" :key="pkg.name" class="glass-card rounded-2xl p-6 space-y-5 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between">
                                <h3 class="text-base font-extrabold text-slate-800">{{ pkg.name }}</h3>
                                <span :class="pkg.tagClass" class="text-xs font-bold px-2.5 py-0.5 rounded-full">{{ pkg.tag }}</span>
                            </div>
                            <ul class="mt-4 space-y-2 text-xs text-slate-500">
                                <li v-for="f in pkg.features" :key="f" class="flex items-center gap-1.5">
                                    <span class="text-blue-500">✓</span> {{ f }}
                                </li>
                            </ul>

                            <div class="grid grid-cols-2 gap-2 mt-6">
                                <div v-for="p in pkg.prices" :key="p.type" class="p-3 border border-slate-200 rounded-xl text-center hover:border-blue-500 cursor-pointer">
                                    <div class="text-[11px] text-slate-400">{{ p.type }}</div>
                                    <div class="text-sm font-extrabold text-slate-800 mt-0.5">¥ {{ p.price }}</div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-4 border-t border-slate-100">
                            <button class="py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md">支付宝支付</button>
                            <button class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md">微信支付</button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- TAB 3: 下载中心 -->
            <template v-if="activeTab === 'download'">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 主系统版本 -->
                    <div class="glass-card rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-extrabold text-slate-800">CXPAY 商业级主系统源码</h3>
                            <span class="text-xs bg-emerald-100 text-emerald-600 font-bold px-2.5 py-0.5 rounded-full">v1.0.7 最新版</span>
                        </div>
                        <div class="space-y-3 text-xs text-slate-500">
                            <div class="font-bold text-slate-700">更新日志：</div>
                            <div>1. 优化续费逻辑，购买新套餐自动替换已有套餐。</div>
                            <div>2. 全新微信协议云端支持个人码/小账本/收款单免挂。</div>
                        </div>
                        <a href="/scratch/pc_project/CXPayAssistant_v4.exe" download class="inline-block px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md">下载最新安装包</a>
                    </div>

                    <!-- 挂机助手软件 -->
                    <div class="glass-card rounded-2xl p-6 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-base font-extrabold text-slate-800">Windows PC 挂机桌面端 v4.0</h3>
                            <span class="text-xs bg-emerald-100 text-emerald-600 font-bold px-2.5 py-0.5 rounded-full">v4.0 拟态旗舰版</span>
                        </div>
                        <div class="space-y-3 text-xs text-slate-500">
                            <div class="font-bold text-slate-700">更新日志：</div>
                            <div>1. 【新增】带有左侧独立侧边栏 + 实时订单流水 List 表格。</div>
                            <div>2. 【新增】全局独立的 监控 Toggle 开关。</div>
                        </div>
                        <a href="/scratch/pc_project/CXPayAssistant_v4.exe" download class="inline-block px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow-md">下载 Windows 端程序</a>
                    </div>
                </div>
            </template>

        </main>

        <!-- 微信/QQ 扫码授权与邮箱绑定 Modal 弹窗 -->
        <div v-if="showQqModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="glass-card rounded-2xl p-6 max-w-md w-full space-y-5 shadow-2xl relative">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-extrabold text-sm text-slate-800">🐧 QQ / 💬 微信 快捷授权绑定</h3>
                    <button @click="showQqModal = false" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div class="text-center space-y-3">
                    <div class="w-48 h-48 mx-auto border-2 border-blue-500/20 rounded-2xl p-2 bg-white flex items-center justify-center">
                        <img :src="qrImg" class="w-full h-full object-contain">
                    </div>
                    <div class="text-xs text-slate-500 font-bold">使用手机 QQ 或 微信 扫一扫完成授权绑定</div>
                </div>

                <div class="space-y-3 pt-3 border-t border-slate-100">
                    <div class="text-xs font-bold text-slate-700">或通过邮箱验证码手动绑定:</div>
                    <div class="flex gap-2">
                        <input type="email" v-model="bindEmail" class="flex-1 px-3 py-2 border rounded-xl text-xs" placeholder="输入绑定 QQ 邮箱 (如 1008611@qq.com)">
                        <button @click="sendEmailCode()" class="px-3 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 font-bold text-xs rounded-xl">发送验证码</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" v-model="bindCode" class="flex-1 px-3 py-2 border rounded-xl text-xs" placeholder="6 位邮箱验证码">
                        <button @click="submitBind()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md">确认绑定</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const activeTab = ref('my-license');

                const moduleList = ref([
                    { name: '云端会员', status: '已到期' },
                    { name: '官方 iPad 云端', status: '已到期' },
                    { name: '微信 PC 挂机', status: '已到期' },
                    { name: '安卓 APP 挂机', status: '已到期' },
                    { name: '官方微信协议云端', status: '剩余 27 天' },
                    { name: 'iOS 挂机', status: '已到期' },
                    { name: 'Win 白挂监控', status: '已到期' },
                    { name: '微信代挂终端', status: '已到期' },
                ]);

                const pricingPackages = ref([
                    {
                        name: '云端会员',
                        tag: '已到期',
                        tagClass: 'bg-rose-100 text-rose-600',
                        features: ['支持在线更新系统', '支付失败订单自动化关单', '享受官方在线技术支持'],
                        prices: [{ type: '月付', price: '10.00' }, { type: '季付', price: '28.00' }, { type: '年付', price: '99.00' }, { type: '永久', price: '9999.00' }]
                    },
                    {
                        name: '官方 iPad 云端',
                        tag: '已到期',
                        tagClass: 'bg-rose-100 text-rose-600',
                        features: ['官方云端服务器，稳定可靠', '方便快捷免去复杂配置 开箱即用', '全部支持个人码、赞赏码、商家码'],
                        prices: [{ type: '月付', price: '49.00' }, { type: '季付', price: '1286.00' }, { type: '年付', price: '499.00' }, { type: '永久', price: '9999.00' }]
                    },
                    {
                        name: '官方微信协议云端',
                        tag: '剩余 27 天',
                        tagClass: 'bg-emerald-100 text-emerald-600',
                        features: ['官方协议服务器，稳定可靠', '支持扫码登录，无需手动截图', '支持小程序 code 获取、手机号获取'],
                        prices: [{ type: '月付', price: '9.90' }, { type: '季付', price: '28.80' }, { type: '年付', price: '99.00' }, { type: '永久', price: '9999.00' }]
                    }
                ]);

                const showQqModal = ref(false);
                const qrImg = ref('https://ssl.ptlogin2.qq.com/ptqrshow?appid=716027609');
                const bindEmail = ref('1008611@qq.com');
                const bindCode = ref('');

                function sendEmailCode() {
                    fetch('/api/cloud/send_email_code', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'email=' + encodeURIComponent(bindEmail.value)
                    }).then(res => res.json()).then(res => alert(res.msg));
                }

                function submitBind() {
                    fetch('/api/cloud/bind_qq', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'email=' + encodeURIComponent(bindEmail.value) + '&code=' + encodeURIComponent(bindCode.value) + '&qq=1008611'
                    }).then(res => res.json()).then(res => {
                        alert(res.msg);
                        showQqModal.value = false;
                    });
                }

                return { activeTab, showQqModal, qrImg, bindEmail, bindCode, sendEmailCode, submitBind, moduleList, pricingPackages };
            }
        }).mount('#app');
    </script>
</body>

</html>
