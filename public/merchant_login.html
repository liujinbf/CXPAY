<!DOCTYPE html>
<html lang="zh-CN" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户独立服务中心 - CXPAY Merchant Portal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- TailwindCSS & Lucide & Vue3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { brand: { 500: '#0284c7', 600: '#0369a1' } },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html.dark body { background-color: #060911; color: #f8fafc; }
        html.light body { background-color: #f1f5f9; color: #0f172a; }

        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            pointer-events: none;
        }

        .glass-login {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
        }
        html.light .glass-login {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(226, 232, 240, 0.8);
            box-shadow: 0 25px 50px -12px rgba(148, 163, 184, 0.35);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

    <div class="ambient-glow bg-sky-500 top-[-100px] left-[-100px]"></div>
    <div class="ambient-glow bg-indigo-600 bottom-[-100px] right-[-100px]"></div>

    <div id="app" class="w-full max-w-md glass-login rounded-3xl p-8 relative z-10">
        <!-- Day/Night Switch -->
        <button @click="toggleTheme()" class="absolute top-6 right-6 w-9 h-9 rounded-full flex items-center justify-center bg-slate-800/20 text-slate-400 hover:text-slate-200 transition-all cursor-pointer">
            <i :data-lucide="isDark ? 'sun' : 'moon'" class="w-4 h-4"></i>
        </button>

        <!-- Brand Header -->
        <div class="text-center mb-6">
            <div class="relative inline-block mb-3">
                <img src="/favicon.svg" alt="CXPAY Logo" class="w-14 h-14 rounded-2xl shadow-xl shadow-sky-500/20 mx-auto">
                <span class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-sky-500 border-2 border-slate-900 flex items-center justify-center text-white">
                    <i data-lucide="store" class="w-3 h-3"></i>
                </span>
            </div>
            <h2 class="text-2xl font-extrabold tracking-tight text-white">CXPAY 商户服务中心</h2>
            <p class="text-xs text-slate-400 mt-1">{{ isRegister ? '三秒完成商户注册，即刻接入全自动聚合支付' : '使用商户名称/PID 与后台密码登录' }}</p>
        </div>

        <!-- 登录 / 注册 Mode Switch -->
        <div class="grid grid-cols-2 p-1 bg-slate-900/60 rounded-xl mb-6 text-xs font-bold text-slate-400 border border-slate-800">
            <button @click="isRegister = false" :class="!isRegister ? 'bg-sky-600 text-white shadow-md' : 'hover:text-slate-200'" class="py-2 rounded-lg transition-all text-center">
                商户登录
            </button>
            <button @click="isRegister = true" :class="isRegister ? 'bg-sky-600 text-white shadow-md' : 'hover:text-slate-200'" class="py-2 rounded-lg transition-all text-center">
                在线注册
            </button>
        </div>

        <!-- Login / Register Form -->
        <form @submit.prevent="handleSubmit" class="space-y-4">
            <div v-if="!isRegister">
                <label class="block text-xs font-bold text-slate-400 mb-1.5">商户名称 / PID</label>
                <div class="relative">
                    <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input v-model="account" type="text" required placeholder="请输入商户名称或 PID 编号" class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all">
                </div>
            </div>

            <div v-if="isRegister">
                <label class="block text-xs font-bold text-slate-400 mb-1.5">自定义商户名称 *</label>
                <div class="relative">
                    <i data-lucide="building" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input v-model="regName" type="text" required placeholder="例如：极客小店 / MyShop" class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1.5">{{ isRegister ? '设置登录密码 (≥6位) *' : '商户后台登录密码' }}</label>
                <div class="relative">
                    <i data-lucide="key" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input v-model="password" type="password" required minlength="6" placeholder="请输入后台登录密码" class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all">
                </div>
            </div>

            <div v-if="!isRegister" class="flex items-center justify-between text-xs text-slate-400 pt-1">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" disabled class="rounded bg-slate-800 border-slate-700 text-sky-500 focus:ring-0"> 使用安全会话
                </label>
                <span class="text-slate-500">忘记密码请联系管理员重置</span>
            </div>

            <button type="submit" class="w-full py-3.5 mt-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <span>{{ isRegister ? '立即注册并获取 PID' : '进入商户控制中心' }}</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- 注册成功精致高光 Modal 弹窗 -->
        <div v-if="showSuccessModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4 animate-fade-in">
            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5 text-left relative">
                <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
                    <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-extrabold text-white">🎉 注册成功！欢迎加入 CXPAY</h3>
                        <p class="text-xs text-slate-400">系统已自动为您签发商户身份与 API 凭据</p>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">您的商户 PID</span>
                        <div class="text-2xl font-black text-sky-400 font-mono tracking-wide">{{ regSuccessData.pid }}</div>
                    </div>

                    <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800 space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">API 安全密钥 (Key)</span>
                            <button @click="copyApiKey" class="text-xs font-bold text-sky-400 hover:text-sky-300 flex items-center gap-1">
                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                <span>{{ copied ? '已复制' : '复制密钥' }}</span>
                            </button>
                        </div>
                        <div class="text-xs font-mono text-slate-300 break-all bg-slate-900 p-2.5 rounded-xl border border-slate-800/80 select-all">
                            {{ regSuccessData.api_key }}
                        </div>
                    </div>
                </div>

                <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs text-amber-300 flex items-start gap-2">
                    <i data-lucide="shield-alert" class="w-4 h-4 shrink-0 mt-0.5"></i>
                    <span>请务必复制保存您的 API 密钥。进入控制台后也可在“API 配置”页面随时查看或重新生成。</span>
                </div>

                <button @click="enterConsole" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-500/20 transition-all flex items-center justify-center gap-2">
                    <span>立即进入商户控制台</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;
        createApp({
            setup() {
                const isRegister = ref(false);
                const account = ref('');
                const regName = ref('');
                const password = ref('');
                const isDark = ref(true);

                const showSuccessModal = ref(false);
                const regSuccessData = ref({ pid: '', api_key: '' });
                const copied = ref(false);

                onMounted(() => {
                    if (window.lucide) lucide.createIcons();
                });

                function toggleTheme() {
                    isDark.value = !isDark.value;
                    document.getElementById('html-root').className = isDark.value ? 'dark' : 'light';
                    setTimeout(() => {
                        if (window.lucide) lucide.createIcons();
                    }, 50);
                }

                async function handleSubmit() {
                    if (isRegister.value) {
                        await handleRegister();
                    } else {
                        await handleLogin();
                    }
                }

                async function handleRegister() {
                    try {
                        const formData = new FormData();
                        formData.append('name', regName.value);
                        formData.append('password', password.value);

                        const res = await fetch('/api/merchant/register', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.code === 1) {
                            regSuccessData.value = {
                                pid: data.data?.pid || '',
                                api_key: data.data?.api_key || '',
                            };
                            showSuccessModal.value = true;
                            await nextTick();
                            if (window.lucide) lucide.createIcons();
                        } else {
                            alert(data.msg || '注册失败，请更换商户名称后重试');
                        }
                    } catch (e) {
                        alert('注册请求失败，请检查网络后重试');
                    }
                }

                function copyApiKey() {
                    if (!regSuccessData.value.api_key) return;
                    navigator.clipboard.writeText(regSuccessData.value.api_key);
                    copied.value = true;
                    setTimeout(() => { copied.value = false; }, 2000);
                }

                function enterConsole() {
                    localStorage.removeItem('cx_merchant_key');
                    window.location.href = '/merchant_center.html';
                }

                async function handleLogin() {
                    try {
                        const formData = new FormData();
                        formData.append('account', account.value);
                        formData.append('password', password.value);

                        const res = await fetch('/api/merchant/login', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.code === 1) {
                            localStorage.removeItem('cx_merchant_key');
                            window.location.href = '/merchant_center.html';
                        } else {
                            alert(data.msg || '商户登录失败，请检查 PID/商户名 与登录密码');
                        }
                    } catch (e) {
                        alert('登录请求失败，请检查网络后重试');
                    }
                }

                return {
                    isRegister, account, regName, password, isDark, toggleTheme, handleSubmit,
                    showSuccessModal, regSuccessData, copied, copyApiKey, enterConsole
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
