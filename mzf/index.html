<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运行目录未正确配置</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
    background: #f5f7fa; color: #1f2733; padding: 20px; }
  .card { width: 100%; max-width: 560px; background: #fff; border: 1px solid #eef1f5;
    border-radius: 18px; padding: 40px 34px; box-shadow: 0 12px 40px rgba(31,41,51,.06); text-align: center; }
  .ic { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: flex; align-items: center;
    justify-content: center; font-size: 38px; background: #fff7ed; color: #f59e0b; }
  h1 { margin: 0 0 10px; font-size: 21px; font-weight: 600; }
  .sub { color: #8a94a6; font-size: 14px; line-height: 1.7; margin: 0 0 24px; }
  .steps { text-align: left; background: #f8fafc; border: 1px solid #eef1f5; border-radius: 12px; padding: 18px 20px; }
  .steps .t { color: #8a94a6; font-size: 13px; margin-bottom: 10px; }
  .steps ol { margin: 0; padding-left: 22px; line-height: 2; font-size: 14px; }
  .steps b { color: #2f6fed; }
  code { background: #eef2fb; color: #2f6fed; padding: 2px 8px; border-radius: 6px; font-size: 13px; }
  .tip { margin-top: 20px; font-size: 12px; color: #aab2bf; }
</style>
</head>
<body>
  <div class="card">
    <div class="ic">⚠️</div>
    <h1>你的网站主运行目录未正确配置</h1>
    <p class="sub">请将网站的「运行目录」切换为 <code>/public</code> 后再访问。<br>本系统入口位于 <code>public/</code> 目录，直接以项目根目录运行将无法正常工作。</p>
    <div class="steps">
      <div class="t">宝塔面板设置方法：</div>
      <ol>
        <li>进入 <b>网站 → 站点设置 → 网站目录</b></li>
        <li>将「<b>运行目录</b>」由 <code>/</code> 改为 <code>/public</code></li>
        <li>点击 <b>保存</b>，然后刷新本页面</li>
      </ol>
    </div>
    <p class="tip">若使用其他面板 / Nginx，请将站点根目录（root）指向本项目的 <code>public</code> 目录。</p>
  </div>
</body>
</html>
