name: Patch admin channel controller

on:
  push:
    branches:
      - fix/p0-hardening

permissions:
  contents: write

jobs:
  patch-controller:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-hardening
          fetch-depth: 0

      - name: Replace synthetic channel fallback
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/controller/admin/AdminController.php')
          source = path.read_text(encoding='utf-8')

          import_line = 'use app\\service\\AlertNotificationService;\n'
          presenter_line = import_line + 'use app\\service\\AdminChannelPresenter;\n'
          if 'use app\\service\\AdminChannelPresenter;' not in source:
              source = source.replace(import_line, presenter_line, 1)

          pattern = re.compile(
              r"    /\*\*\n"
              r"     \* 获取平台通道概览，列表接口不返回任何解密后的敏感配置。\n"
              r"     \*/\n"
              r"    public function listChannels\(\): string\n"
              r"    \{.*?\n"
              r"    \}\n\n"
              r"    /\*\*\n"
              r"     \* 保存/更新支付通道",
              re.DOTALL,
          )

          replacement = '''    /**
           * 获取平台通道概览，列表接口不返回任何解密后的敏感配置。
           */
          public function listChannels(): string
          {
              $channels = Channel::where('merchant_id', 0)
                  ->select([
                      'id', 'pay_category', 'title', 'c_type', 'remark', 'weight',
                      'single_min', 'single_max', 'day_max', 'online_status',
                      'last_heartbeat_time', 'status',
                  ])
                  ->orderByDesc('id')
                  ->get()
                  ->toArray();

              return json_encode([
                  'code' => 1,
                  'data' => AdminChannelPresenter::format($channels),
              ], JSON_UNESCAPED_UNICODE);
          }

          /**
           * 保存/更新支付通道'''

          source, replacements = pattern.subn(replacement, source, count=1)
          if replacements != 1:
              raise SystemExit(f'Expected one listChannels block, replaced {replacements}')

          path.write_text(source, encoding='utf-8')

      - name: Commit precise controller change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/controller/admin/AdminController.php
          git diff --cached --check
          git commit -m "fix: return only persisted admin channels"
          git push origin HEAD:fix/p0-hardening
