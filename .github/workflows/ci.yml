name: CI

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, curl, bcmath, openssl, pdo_sqlite, redis
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          composer validate --strict 2>&1 | tee .ci-logs/composer-validate.log

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          composer install --prefer-dist --no-interaction --no-progress 2>&1 | tee .ci-logs/composer-install.log

      - name: Check PHP syntax
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          find app support config process tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l 2>&1 \
            | tee .ci-logs/php-syntax.log

      - name: Run PHPUnit
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          vendor/bin/phpunit --testdox 2>&1 | tee .ci-logs/phpunit.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: .ci-logs
          if-no-files-found: warn
          retention-days: 7
