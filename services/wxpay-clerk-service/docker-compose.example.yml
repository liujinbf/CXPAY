services:
  gewe:
    image: registry.cn-chengdu.aliyuncs.com/tu1h/wechat-universal:latest
    restart: unless-stopped
    volumes:
      - gewe-data:/root/temp
    environment:
      GEWE_CALLBACK_URL: "http://wxpay-clerk-service:8080/wechat/message/${WXCLERK_WEBHOOK_TOKEN:?请设置WXCLERK_WEBHOOK_TOKEN}"
    expose:
      - "2531"
    networks: [clerk-net]

  wxpay-clerk-service:
    build: .
    restart: unless-stopped
    working_dir: /app
    command: php -S 0.0.0.0:8080 /app/index.php
    env_file:
      - path: .env
        required: false
    environment:
      GEWE_API_URL: http://gewe:2531
      WXCLERK_SQLITE_PATH: /app/storage/clerk.sqlite
    volumes:
      - clerk-data:/app/storage
    depends_on: [gewe]
    expose: ["8080"]
    networks: [clerk-net]

  outbox-worker:
    build: .
    restart: unless-stopped
    working_dir: /app
    command: php bin/dispatch-outbox.php
    env_file:
      - path: .env
        required: false
    environment:
      WXCLERK_SQLITE_PATH: /app/storage/clerk.sqlite
    volumes:
      - clerk-data:/app/storage
    depends_on: [wxpay-clerk-service]
    networks: [clerk-net]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [wxpay-clerk-service]
    networks: [clerk-net]

volumes:
  gewe-data:
  clerk-data:

networks:
  clerk-net:
