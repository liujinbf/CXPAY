# ─────────────────────────────────────────────────────────────────────────────
# CXPAY Secret — 敏感配置（生产环境请用 Sealed Secrets / Vault 替代明文）
# 使用前：kubectl create secret generic cxpay-secret -n cxpay \
#   --from-literal=APP_KEY=<32位随机字符串> \
#   --from-literal=DB_PASSWORD=<数据库密码> \
#   --from-literal=REDIS_PASSWORD=<Redis密码> \
#   --from-literal=METRICS_SCRAPE_TOKEN=<Prometheus抓取令牌>
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: cxpay-secret
  namespace: cxpay
type: Opaque
# stringData 仅用于文档示意，生产请通过 kubectl create secret 命令创建
# stringData:
#   APP_KEY: "your-32-char-random-key-here"
#   DB_PASSWORD: "your-db-password"
#   REDIS_PASSWORD: "your-redis-password"
#   METRICS_SCRAPE_TOKEN: "your-scrape-token"
